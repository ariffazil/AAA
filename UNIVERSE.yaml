    purpose: Declare law, ratify floors, seal irreversible decisions
    invariant: Authority flows UP from this layer to sovereign F13
  - id: GOVERNOR
    function: governance
    purpose: Registry SOT, capability catalog, agent identity, civil registry
    invariant: Single-writer of this atlas
  - id: METABOLISM
    function: metabolism
    purpose: Flow receipts, FQ pulse, attention checkpointing, cooling ledger
    invariant: Records every execute/verify step; cannot mutate production
  - id: HANDS
    function: execution
    purpose: Mutate, deploy, repair under constitutional authority
    invariant: Cannot self-certify; must be judged before seal
  - id: SENSES
    function: perception
    purpose: Ingest, verify, observe multimodal — Telegram, browser, search
    invariant: OBSERVE_ONLY lane; never executes mutation
  - id: EARTH
    function: earth_reality
    purpose: Geoscience, seismic, basin, petrophysics, prospect evaluation
    invariant: COMPUTE_ONLY; evidence-first, falsification-mandatory
  - id: ECONOMY
    function: economic_reality
    purpose: Capital math, market, risk, portfolio, wisdom
    invariant: COMPUTE_ONLY; receipts > narratives
  - id: HEALTH
    function: human_readiness
    purpose: Vitality, fatigue, dignity, homeostasis, biometric substrate
    invariant: REFLECT_ONLY; never prescribes action to other organs
  - id: PUBLIC
    function: public_surface
    purpose: External-facing site, essays, public seals, sovereign voice
    invariant: F13 veto over all published content

