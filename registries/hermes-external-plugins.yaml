meta:
  version: 1.1.0
  corrected: 2026-10-17
  correction_note: >
    v1.0.0 incorrectly listed hermes-plugin-guard, context-audit,
    hermes-session-diff, and qdrant-memory as installable Hermes plugins.
    They are NOT. hermes-plugin-guard is a generic Python package on PyPI.
    context-audit exists as PyPI/npm but not as a Hermes plugin.
    hermes-session-diff and qdrant-memory do not exist at all.
    v1.1.0 reflects actual reality.
  authority: ARIF (F13 SOVEREIGN)
  internal_control: arif-core (OpenCode plugin, KVM8)
  hermes_location: KVM4

# ── Actual MY HERMES plugin state (OBSERVED by Arif 2026-10-17) ────────────

