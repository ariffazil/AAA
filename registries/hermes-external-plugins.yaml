# ── Plugin decisions (authorization from Arif 2026-10-17) ───────────────────

plugins:

  hermes-plugin-guard:
    decision: SEAL_SANDBOX
    repo: mauricemohr88-debug/hermes-plugin-guard
    license: MIT
    install: git clone ~/.hermes/plugins/hermes-plugin-guard
    sha: null  # pin after first clone
    description: >
      Static no-execution security scanner. Reads manifests, Python source,
      and dependency declarations as data — never imports or executes target.
    hooks: []  # no hooks — read-only tool only
    collision_with_arif_core: NONE
    authorized_actions:
      - clone pinned commit into isolated staging
      - independently inspect source before execution
      - verify deps, subprocess, network, filesystem scope
      - enable only in disposable Hermes profile
    not_authorized:
      - production enablement until self-audit passes

  context-audit:
    decision: SEAL_SANDBOX
    catalog_sha: 2aaa96aab2c685798b011a5d6479a4a1fa6a033f
    maintainer: ZidoCode
    version: "0.1.0"
    install: hermes plugins install context-audit
    description: >
      Context-window forensics. Per-turn token estimates, largest tool output,
      oversized calls (>50KB), compaction events. Metadata only in local SQLite.
    hooks:
      - observation hooks (no tool-execution middleware)
    collision_with_arif_core: LOW
    authorized_actions:
      - install pinned in disposable profile
      - generate controlled tool/compaction events
      - verify SQLite contains metadata only
      - measure storage growth and overhead
      - test plugin failure isolation
    production_enable_criteria:
      - no raw tool content stored
      - database growth bounded
      - plugin failure doesn't break session
      - no autonomous deletion or compaction
      - overhead measured and acceptable

  epistemic-harness:
    decision: HOLD_COMPARE_EXISTING_PLUGIN
    repo: https://github.com/quangphucqp/epistemic-harness
    pinned_sha: eb45ca676df53cce0629a3cc5dcf8a7bdab1c806
    compatibility: "Hermes >=0.21,<1.0"
    catalog_entry: plugin-catalog/epistemic-harness.yaml
    tools:
      - epistemic_model
      - epistemic_probe
    hooks:
      - LLM hook
      - tool result hook
      - subagent stop
      - session reset
      - session finalize
    middleware:
      - tool-execution middleware
    description: >
      Records provisional claims before evidence-gathering, links actual
      observations, resolves as CONFIRMED/REFUTED/UNKNOWN.
    collision_with_arif_core: HIGH_IF_EXTERNAL
    decision_rationale: >
      Plugin EXISTS in catalog (corrected from v1.1.0 NOT FOUND error).
      But hook collision with arif-core is high. Do not port blindly.
      Run collision experiment first.
    collision_audit_questions:
      - "Is claim recorded before every tool or only evidence-gathering tools?"
      - "Is raw observation preserved?"
      - "Does transform_tool_result alter evidence the model sees?"
      - "Who determines confirmed/refuted/unknown?"
      - "Can middleware precede governance gate?"
      - "Does session reset/finalize collide with carry-forward?"
    port_strategy: >
      If only claim-evidence data model has value, port SCHEMA + INVARIANTS
      (Claim ID, Provisional status, Expected falsifier, Evidence reference,
      Observed result, Resolution status, Resolver authority) — not full hooks.
      arif-core should bind claims only when operation explicitly tests something.
    possible_outcomes:
      - USE_EXTERNAL_SANDBOX
      - PORT_SCHEMA_ONLY
      - PORT_BOUNDED_CAPABILITY
      - REJECT
      - UNKNOWN

  hermes-session-diff:
    decision: KEEP_DISABLED
    description: >
      Persistent file diffs and run comparisons in Desktop.
      pre_llm_call hook + tool-execution middleware.
    collision_with_arif_core: MODERATE
    skip_rationale: >
      arif-core already tracks file mutations and receipts.
      Without demonstrated human-visible diff gap, adding this
      increases middleware overlap and persistence surface.
    revisit: only if human-visible diff is a demonstrated gap

  qdrant-memory:
    decision: REJECT
    description: >
      LLM-extracted facts in Qdrant. Conversation text sent to LLM.
      Single-writer. Deletion not forensic.
    rejection_reason: DUPLICATE_MEMORY_OWNER
    existing_coverage:
      - arif-core session memory
      - carry_forward.json
      - scars
      - arifFlow receipts
      - Qdrant infrastructure (already via MCP)
      - AAA memory doctrine (L1-L6)

# ── Category rules (default REJECT) ─────────────────────────────────────────

category_reject:
  external_judgment: arifOS owns judgment
  external_execution: A-FORGE owns execution
  external_approval_ledger: arifOS F1-F13 owns gates
  external_model_router: FED owns routing
  external_self_healing: arif-core + engine own recovery
  external_memory_governor: kernel owns memory promotion
  external_identity_provider: arif-core owns identity binding
  external_receipt_owner: arif-core owns receipt chain

