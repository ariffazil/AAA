# ─────────────────────────────────────────────────────────────
# POLICIES — apply to ALL adapters automatically
# ─────────────────────────────────────────────────────────────
policies:
  fq_gate_default: false
  failure_pause_threshold: 3
  outcome_dedup: true
  cost_limit_usd_monthly: 10
  auto_retire_engagement_threshold: 0.1
  auto_optimize_after_runs: 30
  witness_emit: true
  witness_destination: arifflow

# ─────────────────────────────────────────────────────────────
# ADAPTERS — implementations of RECUR capability
# ─────────────────────────────────────────────────────────────
adapters:
  cron:
    type: machine
    source: /etc/cron.d/ + root-crontab
    llm: false
    cost_per_run: 0
    persistence: indefinite
    owner: OS

  systemd:
    type: machine
    source: systemd-timers
    llm: false
    cost_per_run: 0
    persistence: indefinite
    owner: OS

  hermes-cron:
    type: agent
    source: ~/.hermes/cron/jobs.json
    llm: true
    cost_per_run: variable
    persistence: days/months
    owner: hermes-gateway

  loop:
    type: session
    source: hermes-/loop
    llm: true
    cost_per_run: variable
    persistence: session-scoped
    owner: current-session

