# ════════════════════════════════════════════════════════════════════════════
# POLICIES — routing & authorization rules
# ════════════════════════════════════════════════════════════════════════════
policies:
  - id: cost-cap
    description: "Never route a request to mmx if estimated cost > $0.10 without explicit F13 ack"
    enforcement: "client-side: estimate before invoke"
  - id: constitutional-channel
    description: "text.constitutional_audit must always use MiniMax-M3 (flagship) never downgrade"
    enforcement: "registry-enforced"
  - id: direct-bypass
    description: "If FED down, agents may invoke mmx directly via shell — no gates"
    enforcement: "always-on"
  - id: shadow-mm-001
    description: "Bypass MiniMax for MY political topics if censorship detected (resolved 2026-08-03, monitored)"
    enforcement: "live monitor + ollama fallback"
  - id: mmx-cli-bug
    description: "mmx cli v1.0.16 has URL builder bug — use direct API or A-FORGE forge_minimax_* instead"
    enforcement: "documentation + skill warning"

