    mitigation:
      - "Report score variance alongside mean"
      - "When variance=0, flag as measurement-blind"
      - "Add per-organ behavioral metrics alongside health scores"

  - id: SHADOW-FR-003
    name: observer_inertia
    severity: MEDIUM
    class: cognitive_shadow
    pattern: >
      FRAME is designed as an observer — it never intervenes. This is
      correct for separation of powers. But the observer can develop
      inertia: it watches things degrade and does nothing because
      "observation only" is its mandate. The Shadow: non-intervention
      becomes a habit, not a principle.
