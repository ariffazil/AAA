      - well_observe_federation_thermal
    failure_mode: "Identical scores across organs = measurement blindness, not health."
    failure_signature: "all_organ_scores_identical AND organ_count > 3"
    evidence:
      - type: session_observation
        date: 2026-09-19
        data: "All8 organs reported 0.95 OPTIMAL. Zero variance."
        provenance: OBSERVED
    floor_posture_delta:
