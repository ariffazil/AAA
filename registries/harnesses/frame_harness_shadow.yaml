    name: identical_score_problem
    severity: MEDIUM
    class: operational_shadow
    pattern: >
      When FRAME's federation thermal probe returns identical scores for
      all organs (e.g., all 0.95 OPTIMAL), the measurement has zero
      variance — which means either everything is perfect (unlikely for
      8 independent services) or the measurement granularity is too
      coarse to detect real variation. Identical scores = no real
      measurement, but FRAME reports it as "all healthy."
    triggers:
