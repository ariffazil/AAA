# ── CONFLICT TIEBREAKER RULES ──
# 2026-10-25: ordering below reflects the four-layer model. Within a layer, earlier rule wins.
tiebreakers:
  - rule: "Agent card beats registry entry"
    apply: "agent-card.json skills[] beats skills.yaml if they disagree on what skills an agent has (L1 > L3)"
  - rule: "Filesystem truth beats registry claim"
    apply: "If a registry says a SKILL.md/card exists at path X but X doesn't exist, filesystem wins"
  - rule: "Live-probed beats hand-maintained"
    apply: "A fresh ss -tlnp probe beats PORT_REGISTRY.json; both are L4 and organs.yaml is the declared owner"
  - rule: "Explicit deprecation marker beats implicit absence"
    apply: "A file with 'DEPRECATED' in header, or under a _deprecated_ path, is deprecated even if not in the deprecation registry — AND no executable consumer may read it (INV-AR-3/8)"
  - rule: "Registry entry beats card omission"
    apply: "If skills.yaml registers a skill but no agent card claims it, skill is orphaned, not deleted"
  - rule: "Newer timestamp beats older on equivalent authority"
    apply: "When two registries of the same layer disagree, compare generation timestamps"
  - rule: "L1 beats L2 beats L3 beats L4 on identity; L4 beats L3 beats L2 on liveness"
    apply: "Identity questions resolve upward to cards. 'Is it running?' resolves downward to the loader/probe. Never use a generated index to answer 'who is this agent'."

