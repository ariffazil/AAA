# ============================================================
# RULES
# ============================================================
rules:
  - NEVER remove disabled providers. Set status: disabled, preserve config.
  - Disabled providers retain their model lists, API URLs, and key references.
  - When a provider recovers (balance, API, key), flip status back to live.
  - FED :7074 is canonical for live balances. Cache only in this file.
  - Fallback chains must have ≥4 entries including at least 1 cross-provider.
  - Constitutional roles (666_JUDGE, 999_SEAL) only on deepseek-v4-pro or 
    MiniMax-M3.
  - Retry primary 3× with exponential backoff before falling back.

# ============================================================
# SOT
# ============================================================
sot:
  canonical_balance: FED :7074/health
  canonical_models: Live API probe per provider
  cache_file: /root/AAA/state/flow_state.json (TTL 5 min)
  this_registry: /root/AAA/registries/models/UNIFIED_PROVIDER_REGISTRY.yaml
  update_cadence: On every session /init + on provider status change

