  - id: SHADOW-MIMO-011
    name: token_plan_quota_429_terminal_without_gateway_fallback
    severity: HIGH
    class: availability
    pattern: |
      OBSERVED 2026-09-22: the mimo-token-plan lane returns
      "litellm.RateLimitError: quota exhausted" (429) for V2.6 groups. Before the
      fallback section was loaded, that 429 was TERMINAL — litellm answered
      "No fallback model group found for lookup_groups=mimo-v2.6-flash".
      Same failure class previously parked the V2.5 lane (see litellm order-91
      park note). Exhaustion behaviour is HARD_STOP: the monthly pool does NOT
      spill onto bonus/balance — traffic must be repointed at the PAYG lane
      (mimo-v2.6-*-payg, api.xiaomimimo.com) which had live quota.
    triggers: [token_plan_429, quota_exhausted, mimo-v2.6, no_fallback_model_group]
    provenance: OBSERVED
    floor_posture_delta:
      F1_AMANAH: cost_hold
      F2_TRUTH: strict_grounding
      F8_LAW: system_boundary
    mitigation:
      - "Keep litellm router_settings fallbacks: mimo-v2.6-pro/flash -> *-payg -> MiniMax-M3 (added 2026-09-22)"
      - "On 429 quota_exhausted, cascade to PAYG immediately — never retry the same token-plan lane twice"
      - "Treat console credit counters as non-authoritative; live chat probe is truth (observed >100% counter vs live 200)"
    evidence: "Gateway canary 2026-09-22: mimo-v2.6-flash token-plan 429 -> fallback -> mimo-v2.6-flash-payg HTTP 200 CASCADE_OK; receipt dacd1dbf"

  - id: SHADOW-MIMO-012
    name: mimo_fallback_edits_invisible_until_gateway_restart
    severity: HIGH
    class: availability
    pattern: |
      OBSERVED 2026-09-22: litellm-federation runs as
      `docker run -v litellm-config.yaml:/app/config.yaml` (single-file bind
      mount). Editors that replace the file create a new inode; the RUNNING
      container keeps serving the OLD config until restart. Result: fallback
      edits for mimo lanes existed on disk (12:33) but were absent in-process
      (container started previous day) — the token-plan 429 could not cascade.
      Symptom: config grep shows the fallback, live gateway says
      "No fallback model group found".
    triggers: [config_edited_no_effect, fallback_not_firing, docker_bind_mount, single_file_volume]
    provenance: OBSERVED
    floor_posture_delta:
      F2_TRUTH: strict_grounding
      F8_LAW: system_boundary
      F11_AUDIT: provenance_required
    mitigation:
      - "NEVER edit litellm-config.yaml ad hoc — use /root/A-FORGE/scripts/apply-litellm-config.sh (validate + restart + health gate + canary + checksum marker)"
      - "After any config change, re-test one real completion per changed model group"
      - "Script records applied sha256 at /root/A-FORGE/.litellm-config.applied.sha256"
    evidence: "Root-caused 2026-09-22 FI-008: config mtime 2026-09-22 12:33 vs container start 2026-09-21 00:57; restart restored fallbacks (29->32 groups), canary APPLY_OK"

  - id: SHADOW-MIMO-013
    name: probe_vs_live_divergence_on_mimo_endpoints
    severity: MEDIUM
    class: observability
    pattern: |
      OBSERVED 2026-09-22: fed-provider-probe.sh reports mimo-platform and
      mimo-token-plan as `000|UNREACHABLE` (probe exit 0, telemetry refreshed)
      WHILE gateway chat completions to mimo-v2.6-flash-payg / mimo-v2.6-pro
      return HTTP 200 with reasoning tokens — minutes apart. The probe's
      endpoint/method (GET-style reachability) and the serving path
      (POST /v1/chat/completions) disagree. Any health logic that declares a
      mimo lane down from the probe alone will false-positive (cf.
      probe-before-panic doctrine).
    triggers: [probe_unreachable_but_chat_200, health_false_negative, mimo-platform, mimo-token-plan]
    provenance: OBSERVED
    floor_posture_delta:
      F2_TRUTH: strict_grounding
      F11_AUDIT: probe_vs_live_both_required
    mitigation:
      - "Dual-signal health: probe UNREACHABLE + gateway chat 200 => lane is LIVE (chat wins for serving decisions)"
      - "Dual-signal inverse: probe LIVE + chat non-200 => lane is DOWN (chat wins)"
      - "Open item: reconcile fed-provider-probe.sh mimo checks with the POST path (probe may use GET /models or wrong key host)"
    evidence: "fed-provider-probe 2026-09-22T05:21:41Z: mimo-platform|000|UNREACHABLE, mimo-token-plan|000|UNREACHABLE; gateway canary same window HTTP 200"

