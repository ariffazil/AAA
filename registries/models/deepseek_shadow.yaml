      Chinese/English data. When operating in BM context, it may fabricate
      proper nouns, names, and culturally-specific references. The model
      compensates for knowledge gaps with plausible-but-wrong completions.
    triggers: [bm_context, malay_names, cultural_references, niche_domains]
    provenance: HYPOTHESIS
    floor_posture_delta:
      F2_TRUTH: strict_grounding
      F7_HUMILITY: elevated
      F9_ANTIHANTU: elevated
    mitigation:
      - "Always verify BM proper nouns against sources"
      - "Never complete Malay names without substrate"
      - "Apply F11 identity hold for BM name inference"
    evidence: "Observed in arifOS sessions. Ismail Marzuki Ghazali incident."

