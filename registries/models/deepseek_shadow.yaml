      R1/reasoner's chain-of-thought is strong but can produce overconfident
      conclusions. The model may treat probabilistic inferences as certainties.
      In agentic loops, this compounds: confident wrong answer → confident
      wrong action → confident wrong memory.
    triggers: [complex_reasoning, multi_step, agentic_loops]
    provenance: HYPOTHESIS
    floor_posture_delta:
      F2_TRUTH: strict_grounding
      F4_CLARITY: require_uncertainty_band
      F7_HUMILITY: elevated
    mitigation:
      - "Strip declarative framing from uncertain outputs"
      - "Add epistemic tag to every claim"
      - "Cross-check high-stakes reasoning against sources"
    evidence: "General LLM pattern, observed in agentic tasks"

