# 2026-08-05: Mirror Hermes ASI working config
# DISABLE_FALLBACK_IPS=1 critical — Telegram fallback IPs unreachable from VPS
[Service]
Environment="HERMES_TELEGRAM_INIT_TIMEOUT=5"
Environment="HERMES_TELEGRAM_DISABLE_FALLBACK_IPS=1"
Environment="HERMES_TELEGRAM_HTTP_CONNECT_TIMEOUT=2"
Environment="HERMES_TELEGRAM_HTTP_POOL_TIMEOUT=2"
Environment="HERMES_TELEGRAM_HTTP_READ_TIMEOUT=3"
