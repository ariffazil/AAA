policy_metadata:
  contract_id: "POL-MEM-ADMISSIBILITY-V1"
  name: "Federated Memory Admissibility & Retrieval Gate Policy"
  version: "1.0.0"
  ratified_by: "F13_SOVEREIGN"
  effective_utc: "2026-09-12T00:00:00Z"
  applies_to:
    - "arifOS arif_memory"
    - "A-FORGE aaaMemoryGate"
    - "Hermes memory client"
    - "AGY FI-009 memory agent"
    - "Graphiti S4 projection pipeline"

status_vocabulary:
  ACTIVE:
    description: "Current valid knowledge within active lifecycle window; eligible for operational reasoning."
    operational_admissible: true
    historical_admissible: true
  REVIEWED:
    description: "Explicitly vetted by human sovereign or apex audit; highest operational authority."
    operational_admissible: true
    historical_admissible: true
  STALE:
    description: "Approaching expiration (review_by date passed); eligible with deprecation warning."
    operational_admissible: true
    historical_admissible: true
    warning: "MEMORY_STALE_REVIEW_REQUIRED"
  EXPIRED:
    description: "Lifecycle expired or historical test artifact. Never admissible in operational mode."
    operational_admissible: false
    historical_admissible: true
    required_tag: "HISTORICAL_RECORD_EXPIRED"
  SUPERSEDED:
    description: "Replaced by a newer factual claim; superseded_by pointer is populated."
    operational_admissible: false
    historical_admissible: true
    required_tag: "HISTORICAL_RECORD_SUPERSEDED"

query_modes:
  operational_default:
    description: "Standard mode for task execution, reasoning, and autonomous decisions."
    admissible_statuses:
      - "ACTIVE"
      - "REVIEWED"
      - "STALE"
    hard_filters:
      sro_version: 1
      reject_expired: true
      reject_superseded: true
    temporal_rules:
      auto_expire_on_current_time: true
      staleness_warning_lead_days: 30
    confidence_floors:
      OBS: 0.90   # Observed facts (tool outputs, sensors)
      DER: 0.75   # Derived conclusions (deterministic proofs, calculations)
      INT: 0.65   # Interpretations (hypotheses, synthesis)
      SPEC: 0.50  # Speculations (exploration signals only, never for actions)
    evidence_rules:
      action_binding_requires_evidence_ref: true
    abstention_behavior:
      silence_on_zero_match: true
      abstention_statement: "NO_ACTIVE_ADMISSIBLE_SRO_MEMORY"

  historical_lineage:
    description: "Audit, forensic, and knowledge evolution mode. Recalls historical trajectory."
    admissible_statuses:
      - "ACTIVE"
      - "REVIEWED"
      - "STALE"
      - "EXPIRED"
      - "SUPERSEDED"
    hard_filters:
      sro_version: 1
      reject_expired: false
      reject_superseded: false
    enrichment_requirements:
      include_validity_window: true
      include_successor_pointer: true
      include_supersession_reason: true
    governance_barrier:
      forbid_direct_mutation_from_historical: true
      warning_banner: "RETRIEVED_UNDER_HISTORICAL_AUDIT_MODE_NOT_OPERATIONAL_FACT"

s4_graph_projection_contract:
  eligibility_gate:
    required_sro_version: 1
    allowed_statuses:
      - "ACTIVE"
      - "REVIEWED"
    require_confidence: 0.70
  expired_projection_mode: "TOMBSTONE_OR_CONTEXT_NODE"
  superseded_projection_mode: "PRECEDENCE_EDGE"
