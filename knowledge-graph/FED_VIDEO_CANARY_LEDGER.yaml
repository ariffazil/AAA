  honest_status: >
    ASR route liveness = UNPROVEN. ASR word-level accuracy = UNPROVEN. Do not
    claim the composite lane has a working speech channel on this evidence.
  designed_but_unrun_test:
    name: "tone-audio hallucination test"
    fixture: "/tmp/canary_tones.wav (3s pure tones, contains NO speech)"
    pass_condition: "ASR returns empty / no-speech marker"
