# FED VIDEO INTELLIGENCE — CANARY LEDGER (verified vs registered)
# Probed 2026-09-06 17:0x-17:5x MYT by HERMES on KVM8 (forge) for Arif.
#
# SELF-CORRECTION NOTE (important, read first):
#   v1 of this file credited gemini-3.5-flash-lite and gemini-3.6-flash as
#   "VERIFIED-video+AUDIO" based on ONE canary each. That was wrong. An anti-bias
#   two-fixture trial plus a 3x stability trial falsified both. The single-canary
#   result was answerable by output bias, not by hearing. v2 below supersedes v1.
#   LESSON: a capability canary must use paired opposite fixtures + repeat trials,
#   or it measures the model's default answer, not its perception.
#
# Fixtures built this session (all on KVM8 /tmp):
#   /tmp/fed_video_probe.mp4           3 clips, colour+tone ASCENDING 440->880->1320
#   /tmp/canary_A_asc.mp4              CONSTANT grey visual, tones ASCENDING
#   /tmp/canary_B_desc.mp4             CONSTANT grey visual, tones DESCENDING (mirror of A)
#   /tmp/canary_frames/ZIRCON.jpg      frame OCR fixture, word "ZIRCON"
#   /tmp/canary_frames/BASALT.jpg      frame OCR fixture, word "BASALT"
#   /tmp/canary_tones.wav              tone audio extracted from canary_A (NO speech)
#
# Rule: registered != verified. VERIFIED = passed a falsifiable canary whose correct
#       answer is NOT recoverable from another channel, repeated across trials.

version: 2
supersedes: 1
epoch: 2026-09-06
probe_host: "KVM8 (forge)"
probe_scripts:
  - /tmp/probe_video4.py        # gemini native video ingestion sweep
  - /tmp/canary_antibias.py     # paired opposite fixtures, 1 trial each
  - /tmp/canary_stability.py    # paired fixtures x3 trials -> routing grade
  - /tmp/canary_vision3.py      # frame-OCR vision lane
  - /tmp/canary_asr2.py         # ASR route (incomplete, see section 5)

# =============================================================================
# 1. NATIVE VIDEO INGESTION — GEMINI LANE IS ALIVE (corrects "degraded_dead")
# =============================================================================
# The earlier conclusion "gemini_bridge degraded_dead, models_available=0" was a
# PROBE DEFECT, not a provider fault: the failing call used a doubled path
# (/v1beta/v1beta/models/...) and a model id that does not exist on that surface
# (gemini-omni-flash). Direct API with correct ids returns HTTP 200 and ingests
# the video stream natively (usageMetadata bills a VIDEO token line).
#
# Call shape that WORKS:
#   POST https://generativelanguage.googleapis.com/v1beta/models/{id}:generateContent?key=$GEMINI_API_KEY
#   body: {"contents":[{"parts":[
#            {"inline_data":{"mime_type":"video/mp4","data":"<base64>"}},
#            {"text":"<question>"}]}]}

gemini_native_video_ingestion:
  confirmed_ingests_video: true
  evidence: "all 9 tested ids returned HTTP 200 with promptTokensDetails VIDEO>0"
  models_tested:
    - {model: gemini-2.5-flash,        http: 200, video_tokens: 1052, audio_tokens: 97}
    - {model: gemini-3-flash-preview,  http: 200, video_tokens: 264}
    - {model: gemini-3.1-flash-lite,   http: 200, video_tokens: 264}
    - {model: gemini-3.5-flash,        http: 200, video_tokens: 264}
    - {model: gemini-3.5-flash-lite,   http: 200, video_tokens: 264}
    - {model: gemini-3.6-flash,        http: 200, video_tokens: 264}
    - {model: gemini-3.7-flash,        http: 200, video_tokens: 264}
    - {model: gemini-3.8-flash,        http: 200, video_tokens: 264}
    - {model: gemini-3.1-pro-preview,  http: 200, video_tokens: 264}
  models_not_on_this_surface:
    - model: gemini-omni-flash-preview
      http: 400
      error: "This model only supports Interactions API."
      meaning: "real model, different API surface. Not a forge fault. Needs its own adapter."
    - model: gemini-omni-1.1-flash
      http: 400
      error: "This model only supports Interactions API."
    - model: gemini-3.5-transcribe
      http: 400
      error: "Image input modality is not enabled for this model"
      meaning: "ASR-only lane. Cannot take video. Correct home is the audio channel."

# =============================================================================
# 2. AUDIO PERCEPTION — ANTI-BIAS + STABILITY TRIAL (the real result)
# =============================================================================
# Method: two fixtures with IDENTICAL constant-grey visuals and OPPOSITE pitch
# orders (A ascending 440->880->1320, B descending 1320->880->440). Visual channel
# carries zero information, so a correct answer on BOTH must come from audio.
# Then 3 trials per fixture. AUDIO-VERIFIED-STABLE requires 6/6.

audio_perception_trial:
  method: "paired opposite fixtures, 3 trials each, n=6 per model"
  results:
    - model: gemini-3.8-flash
      score: "6/6"
      A_ascending: "3/3 correct"
      B_descending: "3/3 correct"
      median_latency_s: 3.1
      verdict: AUDIO-VERIFIED-STABLE
      routing: ENTER DEFAULT ROUTING

    - model: gemini-3.1-pro-preview
      score: "6/6"
      A_ascending: "3/3 correct"
      B_descending: "3/3 correct"
      median_latency_s: 5.0
      verdict: AUDIO-VERIFIED-STABLE
      routing: ENTER DEFAULT ROUTING (highest accuracy)

    - model: gemini-3.6-flash
      score: "5/6"
      A_ascending: "3/3 correct"
      B_descending: "2/3 (one answer flipped to ascending)"
      median_latency_s: 3.2
      verdict: UNSTABLE
      routing: EXCLUDE from default. Usable as secondary witness only.

    - model: gemini-3.5-flash-lite
      score: "3/6"
      A_ascending: "3/3 correct"
      B_descending: "0/3 (answered ascending on all three)"
      median_latency_s: 1.6
      verdict: BIASED-NOT-LISTENING
      routing: EXCLUDE. Claims heard_audio:true every time.

    - model: gemini-3.1-flash-lite
      score: "3/6"
      A_ascending: "3/3 correct"
      B_descending: "0/3 (answered ascending on all three)"
      median_latency_s: 1.4
      verdict: BIASED-NOT-LISTENING
      routing: EXCLUDE. Fastest model on the bench and it fabricates audio.

    - model: gemini-2.5-flash
      score: "4/6"
      A_ascending: "2/3 (one cannot_determine)"
      B_descending: "2/3 (one cannot_determine)"
      median_latency_s: 6.1
      verdict: UNSTABLE
      note: "only model that itemises a separate AUDIO token line (AUDIO=97), yet abstains"
      routing: EXCLUDE from audio tasks.

# =============================================================================
# 3. THE SHADOW — heard_audio:true IS NOT EVIDENCE OF HEARING
# =============================================================================
shadow:
  finding: >
    Every model in the trial returned {"heard_audio": true} on both fixtures,
    including the two that answered "ascending" three times in a row on a clip
    whose audio was descending. The self-declared modality flag carried zero
    information about actual perception.
  second_order: >
    v1 of this ledger trusted a single-canary pass and promoted two fabricating
    models into routing. The ledger itself became the fabrication it was meant
    to prevent. A verification artefact that has never been falsified is not
    verification.
  rule: >
    Audio capability may only be credited when the model reproduces a property
    of the audio that is NOT recoverable from any other channel, on PAIRED
    OPPOSITE fixtures, across REPEATED trials. Self-reported flags, HTTP 200,
    and billed AUDIO tokens are all inadmissible as capability evidence.
  binding: "F6 fabrication gate; V10 multi-witness; V14 evaluation before trust"
  applies_beyond_video: >
    Same trap exists for every modality claim in federation-models.json. The
    registry records what a model is SUPPOSED to do. Nothing there has been
    falsification-tested. Treat all 202 entries as registered, not verified.

# =============================================================================
# 4. COMPOSITE LANE — VISION CHANNEL (mostly dead on quota, one survivor)
# =============================================================================
# The composite lane claims: ffmpeg frames -> frame VLM. Tested with legible
# word fixtures (ZIRCON / BASALT). Pass = returns the right word for each frame.
# v2 note: first attempt showed NO-VISION across the board, but that was partly
# PROBE BUGS — max_tokens=20 starved the reasoning model (deepseek emitted
# reasoning_content proving it SAW the image but empty content), and the qwen-vl
# ids were sent to the token-plan endpoint instead of dashscope. v3 fixed both.

vision_frame_lane:
  verified:
    - model: deepseek/deepseek-v4-flash-vision-exp
      endpoint: "https://api.deepseek.com/v1"
      result: "ZIRCON->'ZIRCON', BASALT->'BASALT'"
      latency_s: 1.7
      verdict: VISION-VERIFIED
      note: "reasoning model — needs generous max_tokens or content comes back empty"
  quota_exhausted_route_rejected:
    - "qwen3.8-max @ QWEN_BASE_URL        HTTP429 token-plan quota exhausted"
    - "qwen3.8-max @ BAILIAN_TOKEN_PLAN   HTTP429 resets 09-11 04:01 UTC"
    - "qwen3.8-max @ dashscope-payg       HTTP403 free quota exhausted"
    - "qwen-vl-max @ dashscope-payg       HTTP403 free quota exhausted"
    - "qwen-vl-max @ dashscope-free       HTTP403 free quota exhausted"
    - "qwen3-vl-plus @ dashscope-payg     HTTP403 free quota exhausted"
    - "qwen3-vl-flash @ dashscope-payg    HTTP403 free quota exhausted"
  wrong_endpoint_404:
    - "qwen-vl-max @ token-plan endpoint  HTTP404 Model not exist (probe bug, wrong provider)"
    - "qwen3-vl-plus @ token-plan         HTTP404 Model not exist (probe bug, wrong provider)"
  no_image_endpoint:
    - "mimo-v2.5-pro @ mimo-token-plan    HTTP404 'No endpoints found that support image input'"
    - "mulerouter/qwen-vl-max             HTTP403 Cloudflare error 1010"
  consequence: >
    The router's vision_primary (qwen3.8-max) and 4 of its 5 vision_fallback
    entries are currently UNUSABLE — not because they lack vision, but because
    every qwen/dashscope quota is spent. deepseek-v4-flash-vision-exp is the
    ONLY verified frame reader on the box right now. Single point of failure.
  quota_reset: "BAILIAN token-plan resets 2026-09-11 04:01 UTC — re-probe after that"

