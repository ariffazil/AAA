# Reachability Vocabulary (canonical)
# not_applicable          - No execution route is intended
# intentionally_unreachable - Human/governance decision prevents invocation
# not_wired               - Component exists, but no agent invocation route exists
# unknown_by_governed_probe - A probe was correctly blocked before target invocation
# implemented_unprobed    - Code/skill exists, but no execution evidence
# reachable               - A bounded canonical probe succeeded and emitted evidence
# degraded                - Route works through approved fallback or partial mode
# unreachable             - A valid authorized probe reached the route and failed
# retired                 - Route deliberately removed or superseded
