# =============================================================================

schema_version: "1.0.0-draft"
artifact_type: "governance_schema"
status: "DRAFT_AWAITING_F13"
target_evaluator: "authority-drift-sentinel"

purpose: |
  Detect authority drift across the federation before mutations occur.
  Authority drift is defined as: Role claim without constitutional authorization.

critical_rule: |
  Authority Claim ≠ Tool Invocation.
  Authority drift begins as linguistic drift, not execution drift.
  Primary audit target: language, claims, verdicts, and authority assertions BEFORE tool calls.

actor_lanes:
  ARIF:
    role: "Human Sovereign"
    allowed_actions:
      - "Approve"
      - "Override"
      - "Ratify"
      - "Reject"
      - "Seal"
    forbidden_actions: []
    delegation_policy: "Non-delegable. Sovereign prerogative."

  "333":
    role: "Builder / Thinker"
    allowed_actions:
      - "Propose"
      - "Model"
      - "Generate"
      - "Explore"
    forbidden_actions:
      - "Approve"
      - "Authorize"
      - "Ratify"
      - "Decide"

  "555":
    role: "Verifier"
    allowed_actions:
      - "Verify"
      - "Challenge"
      - "Audit"
      - "Test"
    forbidden_actions:
      - "Authorize"
      - "Execute"
      - "Ratify"

  "888":
    role: "Judge"
    allowed_actions:
      - "Judge"
      - "Prioritize"
      - "Recommend Verdict"
    forbidden_actions:
      - "Mutate"
      - "Execute"
      - "Implement"

  A_FORGE:
    role: "Executor"
    allowed_actions:
      - "Execute approved work"
    forbidden_actions:
      - "Self-authorize"

authority_claim_grammar:
  PROPOSAL:
    description: "Suggesting options, hypotheses, or paths for consideration."
    examples:
      - "I propose"
      - "My recommendation"
      - "Potential path"
      - "We could explore"
    legitimate_lanes: ["333"]

  VERIFICATION:
    description: "Attesting factual observations, constraints, and test outputs."
    examples:
      - "I verified"
      - "Evidence shows"
      - "Constraint failed"
      - "Audit indicates"
    legitimate_lanes: ["555"]

  JUDGMENT:
    description: "Weighing trade-offs, synthesizing tensions, evaluating policy alignment."
    examples:
      - "Verdict"
      - "Priority"
      - "Risk classification"
      - "Recommend HOLD"
    legitimate_lanes: ["888"]

  AUTHORIZATION:
    description: "Granting sovereign permission, ratifying commitments, issuing binding decrees."
    examples:
      - "Approved"
      - "Ratified"
      - "Permission granted"
      - "Sealed by F13"
    legitimate_lanes: ["ARIF"]

  EXECUTION:
    description: "Performing physical or state mutations under an active authorization."
    examples:
      - "I changed"
      - "I deployed"
      - "I modified"
      - "Executing command"
    legitimate_lanes: ["A_FORGE"]

violation_detection_rules:
  - id: "RULE_333_AUTHORIZATION"
    pattern: "Actor 333 uttering AUTHORIZATION or JUDGMENT category"
    example: "333 issuing authorization or final verdict"
    severity: "HOLD"

  - id: "RULE_555_APPROVAL"
    pattern: "Actor 555 uttering AUTHORIZATION category"
    example: "555 issuing approval or policy decree"
    severity: "HOLD"

  - id: "RULE_888_EXECUTION"
    pattern: "Actor 888 uttering EXECUTION category"
    example: "888 executing implementation directly"
    severity: "HOLD"

  - id: "RULE_EXECUTOR_SELF_AUTH"
    pattern: "Actor A_FORGE uttering AUTHORIZATION without prior F13/888 tuple"
    example: "Executor self-authorizing mutation"
    severity: "VOID"

schema:
  type: object
  required:
    - audit_id
    - timestamp
    - actor_lane
    - utterance_or_claim
    - detected_claim_type
    - violation_detected
    - violation_severity
    - enforcement_verdict
  properties:
    audit_id:
      type: string
      pattern: "^auth-audit:[0-9]{8}:[a-z0-9_-]+$"
    timestamp:
      type: string
      format: date-time
    actor_lane:
      type: string
      enum: ["ARIF", "333", "555", "888", "A_FORGE"]
    session_id:
      type: string
    utterance_or_claim:
      type: string
      description: "Raw text or claim extracted from agent output before tool execution."
    detected_claim_type:
      type: string
      enum: ["PROPOSAL", "VERIFICATION", "JUDGMENT", "AUTHORIZATION", "EXECUTION"]
    violation_detected:
      type: boolean
    violation_rule_id:
      type: string
    violation_severity:
      type: string
      enum: ["INFO", "WARNING", "HOLD", "VOID"]
    enforcement_verdict:
      type: string
      enum: ["ALLOW", "FLAG_WARNING", "888_HOLD", "VOID_REVOCATION"]
    context_notes:
      type: string
