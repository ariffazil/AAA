schema_version: "1.0.0-draft"
artifact_type: "governance_schema"
status: "DRAFT_AWAITING_F13"
target_evaluator: "contradiction-accumulator"

purpose: |
  Manage contradiction attention economically.
  Not all contradictions deserve pursuit.
  Prevent epistemic landfills by attaching half-life decay to unacted tensions.

law_5_grounding: |
  Stop verifying when additional verification cannot change a decision.
  Goal: Minimize entropy, not maximize investigations.

contradiction_states:
  OPEN:
    description: "Newly recorded contradiction, awaiting initial appraisal."
  ACTIVE:
    description: "Actively affecting present reasoning or pending actions."
  CONTESTED:
    description: "Under active evidentiary challenge by opposing witnesses."
  DORMANT:
    description: "Temporarily inactive; no current decisions depend on it; preserved for future relevance."
  RESOLVED:
    description: "Synthesized or formally decided by legitimate authority."
  SUPERSEDED:
    description: "Replaced by a newer understanding or higher-order framework."

auto_dormant_rule:
  condition: |
    (current_date - last_touched > half_life_days)
    AND (attention_cost < attention_cost_threshold)
    AND (decision_relevance < decision_relevance_threshold)
  transition: "ACTIVE -> DORMANT"
  rationale: |
    Transition to DORMANT, NOT SUPERSEDED.
    Dormant contradictions are not erased; they may later become relevant
    when decisions touch their problem space again.

priority_formula:
  direction:
    increase_with:
      - "decision_relevance"
      - "reality_cost"
    decrease_with:
      - "age_days"
      - "attention_cost"
  expression: |
    priority_score = (decision_relevance * 0.5 + reality_cost * 0.5) / (1.0 + (age_days / half_life_days) + (attention_cost / 100.0))

schema:
  type: object
  required:
    - contradiction_id
    - claim_a
    - claim_b
    - claim_state_a
    - claim_state_b
    - attention_cost
    - reality_cost
    - last_touched
    - half_life_days
    - decision_relevance
    - supporting_evidence
    - contradiction_state
  properties:
    contradiction_id:
      type: string
      pattern: "^contra:[0-9]{8}:[a-z0-9_-]+$"
    claim_a:
      type: string
      description: "Identifier or canonical statement of Claim A."
    claim_b:
      type: string
      description: "Identifier or canonical statement of Claim B."
    claim_state_a:
      type: string
      enum: ["CANDIDATE", "ACTIVE", "CONTESTED", "SUPERSEDED", "DORMANT", "DELIBERATELY_OPEN", "REVOKED", "FORGOTTEN"]
    claim_state_b:
      type: string
      enum: ["CANDIDATE", "ACTIVE", "CONTESTED", "SUPERSEDED", "DORMANT", "DELIBERATELY_OPEN", "REVOKED", "FORGOTTEN"]
    attention_cost:
      type: number
      description: "Attention budget minutes expended by agents/human on this tension."
    reality_cost:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Potential risk or consequence to physical/human reality if unresolved."
    last_touched:
      type: string
      format: date-time
      description: "Timestamp of last invocation or active deliberation."
    half_life_days:
      type: integer
      default: 30
      description: "Days before an unreferenced contradiction transitions to DORMANT."
    decision_relevance:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Degree to which an active pending decision depends on this resolution."
    supporting_evidence:
      type: array
      items:
        type: string
      description: "Pointers to evidence files, diffs, or witness statements."
    contradiction_state:
      type: string
      enum: ["OPEN", "ACTIVE", "CONTESTED", "DORMANT", "RESOLVED", "SUPERSEDED"]
    resolution_notes:
      type: string
