# Authority: ARIF (Human Sovereign)
# Reference: ARIFOS::SOVEREIGNTY_CRONS::SCHEMA_FIRST::v1
# Mode: GOVERNANCE-FIRST
# Constraints: DESIGN ONLY · NO RUNTIME MUTATION · NO CRON CREATION
# =============================================================================

schema_version: "1.0.0-draft"
artifact_type: "governance_schema"
status: "DRAFT_AWAITING_F13"
target_evaluator: "reality-debt-auditor"

purpose: |
  Prevent audit-theatre.
  Ensure Reality Impact is measured by witnessed consequences rather than receipt volume.
  Enforce epistemic cost for claiming impact: Mutation ≠ Consequence.

core_rule: |
  Witness Count alone is insufficient.
  Reality Class is mandatory.

reality_classes:
  R1:
    name: "File Mutation"
    description: "File changed."
    examples:
      - "Markdown updated"
      - "Config changed"
      - "YAML rewritten"
      - "Git commit created"
    default_interpretation: "Theatrical possibility."
    base_weight: 0.05
    reality_producing: false

  R2:
    name: "System State Mutation"
    description: "System state changed."
    examples:
      - "Service restarted"
      - "Container deployed"
      - "Cron installed"
      - "Port bound"
    default_interpretation: "Infrastructure consequence."
    base_weight: 0.10
    reality_producing: false

  R3:
    name: "Capability State Mutation"
    description: "Capability state changed."
    examples:
      - "New capability became reachable"
      - "Registry entry became executable"
      - "Broken dependency repaired"
      - "MCP tool exposed and verified"
    default_interpretation: "Operational consequence."
    base_weight: 0.25
    reality_producing: false

  R4:
    name: "Human Behavior Mutation"
    description: "Human behavior changed."
    examples:
      - "User workflow changed"
      - "Governance process changed"
      - "Decision path changed"
      - "Human principal rested or acted on advice"
    default_interpretation: "Human consequence."
    base_weight: 0.60
    reality_producing: true

  R5:
    name: "External Reality Mutation"
    description: "External reality changed."
    examples:
      - "Cost avoided"
      - "Revenue created"
      - "Risk reduced"
      - "Human relationship preserved"
      - "Real-world mission advanced"
    default_interpretation: "Reality consequence."
    base_weight: 1.00
    reality_producing: true

mandatory_verdict_rule:
  condition: "all(record.reality_class in ['R1', 'R2'] for record in reporting_period)"
  verdict: "THEATRICAL"
  rule_text: |
    If a reporting period produces only R1 and R2,
    then system verdict: THEATRICAL,
    regardless of receipt volume, green telemetry, or test pass rates.

schema:
  type: object
  required:
    - artifact_id
    - capability_id
    - actor
    - timestamp
    - consequence_description
    - reality_class
    - witness_count
    - witness_independence_score
    - evidence_links
    - claim_links
    - reality_origin
    - attribution_confidence
  properties:
    artifact_id:
      type: string
      pattern: "^imp:[0-9]{8}:[a-z0-9_-]+$"
      description: "Unique deterministic identifier for the witnessed impact."
    capability_id:
      type: string
      description: "Identifier of the constitutional capability exercised."
    actor:
      type: string
      description: "Actor who triggered or executed the action (e.g. arif, 333-agi, a-forge)."
    timestamp:
      type: string
      format: date-time
    consequence_description:
      type: string
      minLength: 15
      description: "Precise factual description of what changed outside the agent cognition."
    reality_class:
      type: string
      enum: ["R1", "R2", "R3", "R4", "R5"]
    witness_count:
      type: integer
      minimum: 0
      description: "Number of independent witness records capturing this event."
    witness_independence_score:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Degree of observational, epistemic, and authority independence of witnesses."
    evidence_links:
      type: array
      items:
        type: string
      description: "URIs, hashes, or file paths of immutable evidence."
    claim_links:
      type: array
      items:
        type: string
      description: "Related claim IDs in the claim ledger."
    reality_origin:
      type: string
      enum:
        - "human_action"
        - "agent_action"
        - "mixed"
        - "external_environment"
        - "unknown"
      description: "Causal origin of the reality change to prevent unearned agent attribution."
    attribution_confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence that the capability was the actual cause of the consequence."

computed_fields:
  reality_score:
    formula: "base_weight[reality_class] * witness_independence_score * attribution_confidence"
    guidance: "R1 = lowest (0.05), R5 = highest (1.00)"
