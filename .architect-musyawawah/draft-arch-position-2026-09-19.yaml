#   - Each axis is independent (any 1/4 can fail alone).
#   - Each axis maps to a different organ (functional=Exec evidence,
#     constitutional=arifOS judgment, witness=witness-layer, scar=dream-engine).
#   - Each axis is outliving the Google PDF that surfaced it.

