# Constitutional Verification: Was it authorized to do it?
# Witness                   : Can it prove what happened?
# Scar                      : Can future behavior change because of it?
#
# These are FOUR orthogonal control surfaces.
# Production agentic systems require ALL four.
# Each one survives vendor / model / framework / 24-month-re-examination death.
