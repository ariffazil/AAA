# ─── SHARED INVARIANTS (apply to ALL families) ───────────────────────────────

shared_invariants:
  chain_fields:
    - prev_hash
    - merkle_leaf
    - chain_hash
  always_required:
    - event_type
  epistemic_rule: >
    If a field is absent, record UNKNOWN — never infer, never fabricate.
    Evidence without provenance is archive, not memory.

# ─── FAMILY 1: SealEvidence ──────────────────────────────────────────────────
# The workhorse. 72% of all events. Every organ action that was sealed.

SealEvidence:
  purpose: "Proves that an action was taken, judged, and irreversibly sealed."
  source_classes: [vault_seal]
  count: 956
  priority: HIGH
  required_fields:
    - ts
    - event_type
    - operator_id
    - session_id
    - judge_rationale
    - ack_irreversible_received
    - merkle_leaf
    - chain_hash
    - integrity_hash
  vectorizable_fields:
    - payload.action_summary          # What happened (semantic core)
    - payload.event_type              # Domain event type (organ_refactor, etc.)
    - payload.organ                   # Which organ (GEOX, WEALTH, WELL, arifOS)
    - payload.verdict                 # SEAL / HOLD / VOID
    - judge_rationale                 # Why this was sealed
  authority_fields:
    - chain_hash
    - merkle_leaf
    - integrity_hash
    - ack_irreversible_received
    - zkpc_metadata
  replay_fields:
    - payload.before_state
    - payload.after_state
    - payload.code_changes
    - payload.invariants_deployed
  verdict_field: payload.verdict
  embedding_strategy: >
    Combine action_summary + organ + event_type + judge_rationale into
    a single vectorizable text. Weight organ + verdict as metadata filters.

