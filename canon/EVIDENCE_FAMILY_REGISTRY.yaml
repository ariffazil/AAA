# ─── EVIDENCE CONTRACT (minimum for any evidence entry) ─────────────────────

evidence_contract:
  description: >
    Every evidence entry in arif_evidence must be able to answer these questions.
    If a field cannot be answered, record UNKNOWN — never fabricate.
  required_answers:
    - question: "What happened?"
      field: "vectorizable_fields (combined)"
    - question: "Who observed it?"
      field: "operator_id / actor_id"
    - question: "When?"
      field: "ts / sealed_at"
    - question: "Under what authority?"
      field: "authority_fields"
    - question: "Can it be replayed?"
      field: "replay_fields"
    - question: "What was the verdict?"
      field: "verdict_field"

