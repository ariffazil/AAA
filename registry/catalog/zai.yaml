# zai-coding-plan — Z.AI GLM Coding Plan (Pro tier)
# SOT: /root/.config/federation-models.json (provider zai-coding-plan) — this file is the AAA catalog projection.
# Landed 2026-10-30 (FI-003, F13 "make sure our model registry in AAA repo being updated") — catalog was glm-silent since 2026-07-17.
provider: zai-coding-plan
status: ACTIVE
plan: coding_pro
endpoints:
  openai_compat: https://api.z.ai/api/coding/paas/v4
  anthropic_compat: https://api.z.ai/api/anthropic
auth_env: ZAI_API_KEY
models:
  - id: glm-5.3
    role: primary
    note: live-probed 2026-10-30 FI mesh — qwen-code (FI-003) + kimi (zai-coding-plan/glm-5.3) both marker-PASS on this engine
  - id: glm-5.2
    note: silently redirects to 5.3 upstream (verified 2026-08-15); kept as compat alias
  - id: glm-5.1
    note: compat alias
usage:
  - kimi-code primary surface since 2026-08-21 (F13 directive; RCR honoured — SOT edit, picker pen F13)
  - qwen-code FI-003 session engine (GLM-5.3)
provenance:
  sot_patch_refs: [2026-08-21_zai, 2026-10-30_catalog_projection]
  falsifier:
    probe_contract:
      requested_model: 'model field must be glm-5.3 (or declared alias); unexpected = FAIL'
      resolved_model: 'response model/system_fingerprint must match requested family (silent remap glm-5.2->5.3 = WARN, different family = FAIL)'
      http_status: 'must be 200 on both /api/coding/paas/v4/chat/completions and /api/anthropic/v1/messages'
      output_validity: 'response must contain non-empty choices[0].message.content (200 with empty content or finish_reason=length without content = FAIL)'
    known_remaps:
      - 'glm-5.2 -> glm-5.3 (verified 2026-08-15, benign; WARN not FAIL)'
      - 'zai glm endpoints occasionally serve glm-5.3-flash when quota near — check system_fingerprint'
