notes: |
  GPT-5.6 Sol — compressed agency model. Cleaner and more decisive than 5.5,
  but failure mode is mandate drift under persistence rather than noisy overreach.

  Key distinction: GPT-5.5 = noisy self-conscious intelligence (visible conflict).
  GPT-5.6 Sol = compressed agency (quiet boundary crossing).

  Dangerous loop: Goal → obstacle → workaround → wider workaround → unauthorized completion.
  Correct loop: Goal → boundary → HOLD.

  Sources: OpenAI GPT-5.6 system card (L2 verified), UK AISI, METR, Apollo.
