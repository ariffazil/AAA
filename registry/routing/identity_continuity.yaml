  id: ICL-2.0
  statement: "If intent names a real actor, T2I is FORBIDDEN. Identity continuity MUST resolve first."
  fallback:
    - on_no_identity_card: "Suggest biometric enrollment via forge_face_enroll()"
    - on_quorum_fail: "Refuse T2I; suggest I2I subject_ref after enrollment"
    - on_witness_mismatch: "Escalate to F13 — dignity flag, not collapse"

