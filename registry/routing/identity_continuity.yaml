    can_use_witnesses: [W1_face, W3_name]
    forge_replacement: forge_face_match (verifier)
  
  forge_face_embed:
    identity_support: BINDING_T1
    can_write_witness: W1_face
    required_consent: biometric.full
    ttl_days: 90
    forge_replacement: forge_face_enroll (full pipeline)
  
  forge_face_match:
    identity_support: BINDING_T1
    can_verify_witness: W1_face
    threshold: 0.65
    forge_replacement: identity_continuity_check (constitutional)
  
  forge_face_enroll:
    identity_support: BINDING_T1
    can_write_witness: W1_face
    required_consent: biometric.full
    dependencies: [forge_face_embed, well_consent_set_scope]
  
  identity_continuity_check:
    identity_support: BINDING_T3
    can_use_witnesses: [W1_face, W2_voice, W3_name, W4_history, W5_relations, W6_scar_ledger]
    quorum_threshold: 0.50
    single_witness_authority: false  # ICL-1.1
  
  hermes_gateway:
    identity_support: WITNESS_COORDINATION
    can_use_witnesses: [W3_name, W5_relations]
    required_check: identity_continuity_check (on named actors)

# ========================================================================
# Biometric Governance (F1 AMANAH × F6 MARUAH)
# ========================================================================

biometric_governance:
  ttl_days: 90
  consent_scope_default: biometric.full
  consent_default_state: OFF  # operator must opt-in
  storage_mode: 600  # owner read/write only
  storage_path: /root/AAA/registry/biometric/<actor>/
  gitignore_patterns:
    - registry/identity_cards/*.yaml  # concrete instances
    - registry/biometric/             # raw vectors
  audit_trail:
    path: /root/VAULT999/biometric/<actor>/
    policy: RECEIPT_ONLY  # fact-of-existence, not embedding
    immutable: true

# ========================================================================
# Failure Modes (Anti-Shadow Architecture)
# ========================================================================

failure_modes:
  F.MISSING_IDENTITY_CARD:
    trigger: "actor_handle not in /root/AAA/registry/identity_cards/"
    response: "Suggest identity_card scaffolding; refuse T2I"
  
  F.W1_UNENROLLED:
    trigger: "identity_card.yaml exists but W1_face.status == NOT_ENROLLED"
    response: "Offer forge_face_enroll; refuse T2I"
  
  F.W1_EXPIRED:
    trigger: "identity_card.yaml W1_face.expiry < now"
    response: "Re-enroll via forge_face_enroll; refuse T2I"
  
  F.FACE_MISMATCH:
    trigger: "forge_face_match returns WEAK (similarity < 0.65)"
    response: "Dignity flag — escalate to F13. Never collapse identity."
  
  F.WITNESS_MISMATCH:
    trigger: "W1 says X, W2 says Y"
    response: "Dignity flag — escalate to F13. Treat as inconsistency, not lie."

