# ========================================================================
# Capability Routing Matrix (when intent triggers self-reference)
# ========================================================================

routing_matrix:
  trigger: self_reference_detected
  flow:
    - step: 1
      action: identity_continuity_check()
      args:
        actor_handle: "{resolved_actor_handle}"
        intent: "{original_intent}"
        named_actor: true
      expected_output: IdentityContinuityReceipt
      
    - step: 2
      condition: "identity_check.quorum_passed == true"
      action: route_to_capability
      routing:
        - if identity_check.witness_set.W1_face >= 0.65:
            capability: aaa-image-editing
            identity_support: REFERENCE
            args:
              subject_ref: identity_card.identity_card_ref
              reference_set: identity_card.witness_set.W1_face.reference_set
            verb: I2I_subject_reference
        - elif identity_check.witness_set.W1_face == 0:
            capability: forge_face_enroll
            identity_support: BINDING_T1
            args:
              purpose: identity_card.purpose
              ttl_days: identity_card.ttl_days
            verb: enroll_first
      
    - step: 3
      condition: "identity_check.quorum_passed == false AND named_actor == true"
      action: refuse_T2I
      rationale: "Named actor but identity continuity failed. T2I FORBIDDEN per ICL-2.0."

