<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6270"/>
    </marker>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#fade)"/>
  <g stroke="#232830" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="420" y1="0" x2="420" y2="640"/>
    <line x1="820" y1="0" x2="820" y2="640"/>
  </g>

  <!-- Title -->
  <text x="60" y="104" fill="#f2f4f7" font-size="58" font-weight="700">AAA</text>
  <text x="60" y="146" fill="#d4a853" font-size="22" letter-spacing="6">ATTENTION BEFORE ACTION</text>

  <!-- Noisy incoming signals -->
  <g font-size="15">
    <rect x="60" y="214" width="230" height="36" rx="8" fill="#1d2229" stroke="#3a4250" stroke-width="1.5"/>
    <text x="175" y="238" fill="#9aa4b2" text-anchor="middle">evidence</text>
    <rect x="76" y="262" width="230" height="36" rx="8" fill="#1d2229" stroke="#3a4250" stroke-width="1.5"/>
    <text x="191" y="286" fill="#9aa4b2" text-anchor="middle">state deltas</text>
    <rect x="60" y="310" width="230" height="36" rx="8" fill="#1d2229" stroke="#3a4250" stroke-width="1.5"/>
    <text x="175" y="334" fill="#9aa4b2" text-anchor="middle">deadlines</text>
    <rect x="88" y="358" width="230" height="36" rx="8" fill="#1d2229" stroke="#3a4250" stroke-width="1.5"/>
    <text x="203" y="382" fill="#9aa4b2" text-anchor="middle">drift</text>
    <rect x="60" y="406" width="230" height="36" rx="8" fill="#1d2229" stroke="#3a4250" stroke-width="1.5"/>
    <text x="175" y="430" fill="#9aa4b2" text-anchor="middle">uncertainty</text>
    <rect x="72" y="454" width="230" height="36" rx="8" fill="#1d2229" stroke="#3a4250" stroke-width="1.5"/>
    <text x="187" y="478" fill="#9aa4b2" text-anchor="middle">contradictions</text>
    <rect x="60" y="502" width="230" height="36" rx="8" fill="#1d2229" stroke="#3a4250" stroke-width="1.5"/>
    <text x="175" y="526" fill="#9aa4b2" text-anchor="middle">receipts</text>
  </g>

  <!-- Converge arrows into the lens -->
  <g stroke="#5a6270" stroke-width="2" marker-end="url(#ah)">
    <path d="M300,232 C390,232 400,330 452,352" fill="none"/>
    <path d="M318,280 C395,280 405,338 452,356" fill="none"/>
    <path d="M300,328 C390,328 410,345 452,359" fill="none"/>
    <path d="M330,376 C400,376 415,365 452,362" fill="none"/>
    <path d="M300,424 C390,424 410,385 452,365" fill="none"/>
    <path d="M314,472 C395,472 405,398 452,368" fill="none"/>
    <path d="M300,520 C390,520 400,410 452,372" fill="none"/>
  </g>

  <!-- Attention lens -->
  <g>
    <rect x="460" y="210" width="270" height="300" rx="18" fill="#1a1d22" stroke="#d4a853" stroke-width="2.5"/>
    <text x="595" y="272" fill="#d4a853" font-size="34" font-weight="700" text-anchor="middle">AAA</text>
    <text x="595" y="302" fill="#f2f4f7" font-size="19" text-anchor="middle">ATTENTION LENS</text>
    <text x="595" y="356" fill="#9aa4b2" font-size="14" text-anchor="middle">P = (Impact × Urgency ×</text>
    <text x="595" y="378" fill="#9aa4b2" font-size="14" text-anchor="middle">EvidenceQuality × Novelty)</text>
    <text x="595" y="400" fill="#9aa4b2" font-size="14" text-anchor="middle">/ AttentionCost</text>
    <text x="595" y="452" fill="#d4a853" font-size="16" font-weight="700" text-anchor="middle">priority ≠ authority</text>
    <text x="595" y="482" fill="#9aa4b2" font-size="13" text-anchor="middle">attention is scarce</text>
  </g>

  <!-- Lens to lanes arrows -->
  <g stroke="#5a6270" stroke-width="2" marker-end="url(#ah)">
    <line x1="732" y1="360" x2="836" y2="240"/>
    <line x1="732" y1="360" x2="836" y2="298"/>
    <line x1="732" y1="360" x2="836" y2="356"/>
    <line x1="732" y1="360" x2="836" y2="414"/>
    <line x1="732" y1="360" x2="836" y2="472"/>
  </g>

  <!-- Five attention-class lanes -->
  <g font-size="18" font-weight="700" text-anchor="middle">
    <rect x="844" y="216" width="264" height="48" rx="24" fill="#3a2f16" stroke="#d4a853" stroke-width="2"/>
    <text x="976" y="247" fill="#d4a853">ACTION_REQUIRED</text>
    <rect x="844" y="274" width="264" height="48" rx="24" fill="#16302c" stroke="#4fd1c5" stroke-width="2"/>
    <text x="976" y="305" fill="#4fd1c5">INFORM</text>
    <rect x="844" y="332" width="264" height="48" rx="24" fill="#20262e" stroke="#6b7280" stroke-width="2"/>
    <text x="976" y="363" fill="#8b95a3">DEFER</text>
    <rect x="844" y="390" width="264" height="48" rx="24" fill="#1a1e24" stroke="#4b5563" stroke-width="2"/>
    <text x="976" y="421" fill="#6b7280">SILENT</text>
    <rect x="844" y="448" width="264" height="48" rx="24" fill="#3a1a1a" stroke="#d9534f" stroke-width="2"/>
    <text x="976" y="479" fill="#d9534f">HOLD</text>
  </g>

  <!-- Downstream -->
  <text x="976" y="546" fill="#9aa4b2" font-size="16" text-anchor="middle">→  Human / arifOS decide</text>

  <!-- Footer -->
  <text x="60" y="606" fill="#9aa4b2" font-size="17">AAA prioritizes. arifOS authorizes. A-FORGE executes.</text>
  <text x="1220" y="606" fill="#d4a853" font-size="16" letter-spacing="3" text-anchor="end">DITEMPA BUKAN DIBERI</text>
</svg>
