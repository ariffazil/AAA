# SearXNG settings — sovereign multi-engine + cache
# Template for arifOS federation. braveapi (REST API) primary, Bing fallback.
# Updated 2026-08-20: brave (scraper) → braveapi (REST API) for datacenter-IP immunity.
use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  default_lang: "en"
  formats: [html, json]

# Engine pool — braveapi (REST API) primary, bing fallback
# DuckDuckGo/Google/Startpage ALL blocked from datacenter IPs — disabled.
# NOTE: "brave" = scraper (blocked), "braveapi" = REST API (works). Different engines!
engines:
  - name: braveapi           # REST API — immune to datacenter IP blocks
    engine: braveapi
    api_key: "${BRAVE_API_KEY}"
    results_per_page: 20
    disabled: false

  - name: bing               # fallback — proven working from this IP
    engine: bing
    shortcut: bi
    disabled: false

  - name: duckduckgo         # BLOCKED from datacenter IP — disabled
    engine: duckduckgo
    shortcut: ddg
    disabled: true

  - name: google             # BLOCKED from datacenter IP — disabled
    engine: google
    shortcut: g
    disabled: true

  - name: startpage          # CAPTCHA from datacenter IP — disabled
    engine: startpage
    disabled: true

  - name: wikipedia          # always works (no scraping needed)
    engine: wikipedia
    shortcut: wp

  - name: arxiv              # always works (academic)
    engine: arxiv
    shortcut: arx

# Redis caching — same query within TTL = served from disk, zero upstream request
redis:
  url: unix:///run/redis-searxng/redis.sock?db=0
cache:
  search_cache: true
  search_cache_ttl: 600         # 10 min
  search_cache_max_size: 1000

outgoing:
  request_timeout: 5.0
  retries: 1                    # retry next engine on failure
  enable_http2: true

ui:
  static_use_hash: true
  default_theme: simple
