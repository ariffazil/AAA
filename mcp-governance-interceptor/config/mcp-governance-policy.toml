# ── Intent Router Domains ──

[intent_router.domains.finance]
keywords = ["trading", "gold", "xauusd", "capital", "wealth", "market", "portfolio", "backtest"]
tools = ["fed_route", "fed_status", "capital_indicator", "capital_ledger", "capital_market"]
priority = 1

[intent_router.domains.geoscience]
keywords = ["basin", "well", "geology", "seismic", "petrophysics", "subsurface", "geox", "prospect"]
tools = ["geox_basin", "geox_claim", "geox_well", "geox_petrophysics"]
priority = 1

[intent_router.domains.wellness]
keywords = ["health", "wellness", "intake", "vitality", "well", "homeostasis"]
tools = ["well_observe_machine", "well_log_intake"]
priority = 1

[intent_router.domains.media]
keywords = ["video", "image", "tts", "voice", "music", "generate", "media", "audio"]
tools = ["generate_video", "text_to_audio"]
priority = 1

[intent_router.domains.system]
keywords = ["status", "health", "federation", "mcp", "tools", "audit", "interceptor"]
tools = ["fed_health", "fed_status"]
priority = 2
