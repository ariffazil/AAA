[package]
name = "mcp-governance-interceptor"
version = "0.1.0"
edition = "2021"
description = "arifOS MCP Governance Interceptor — deterministic proxy for tool-call enforcement"
authors = ["arifOS Federation"]

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
dirs = "5"

[[bin]]
name = "mcp-interceptor"
path = "src/main.rs"
