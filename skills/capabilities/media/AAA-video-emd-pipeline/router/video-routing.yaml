# AAA-video-emd-pipeline — Routing SOT
# Rule: registered ≠ verified. Only canary-verified models enter default routing.
# Probed 2026-09-06 by 333-AGI (federation-models.json + FED :4000 + bridge :18092).
version: 1
epoch: 2026-09-06

video_understanding:
  canonical_lane: fed-video-understanding
  default_mode: composite

  input_modes:
    native_omni:
      eligibility:
        - duration_s <= 300
        - model_health == verified
        - audio_required == true
      candidates:
        - qwen3.5-omni-plus      # mulerouter gateway
        - qwen3.5-omni-flash
        - qwen3-omni-flash
      role: fast_initial_witness
      authority: non_final        # never the sole judge

    composite:
      stages:
        - acquire_and_hash        # yt-dlp/local → sha256 manifest
        - captions_or_fed_audio_asr
        - scene_detect_and_dedup  # ffmpeg scene-aware + near-dup drop
        - frame_vlm
        - ocr_targeted_frames     # AAA-OCR-optical-compression cascade
        - fusion                  # agreement/contradiction/absence across witnesses
        - evidence_grounded_claims
      vision_primary:
        - qwen3.8-max             # registered primary (vision_models SOT)
        - deepseek-v4-flash-vision-exp  # F13-promoted 2026-08-31, primary-for-now
      vision_fallback:
        - mimo-v2.5-pro
        - qwen-vl-max
        - qwen3-vl-plus
        - qwen3-vl-flash
      asr:
        - fed/audio-asr           # FED alias, live
        - glm-asr-skill           # AAA-asr-glm-ingest (GLM-ASR-2512)
        # gemini-3.5-transcribe EXCLUDED — see gemini_bridge below
      role: default_audit_lane

  gemini_bridge:
    status: degraded_dead
    evidence: "2026-09-06 canary: GET /models → 404, GET /v1/models → 404 (bridge TCP-up, credentials configured, models_available=0)"
    policy: exclude_from_primary_and_fallback_until_full_inference_canary_passes
    hold: 888-HOLD-PROVIDER

  model_health_ledger:
    # entries move registered → verified only via capability-specific canary
    # canary = fixed input hash + expected output schema + latency band + non-empty availability
    verified: []   # none yet — canary suite is forge-sequence step 3
    registered:
      - qwen3.8-max
      - deepseek-v4-flash-vision-exp
      - mimo-v2.5-pro
      - qwen-vl-max
      - qwen3-vl-plus
      - qwen3-vl-flash
      - qwen3.5-omni-plus
      - qwen3.5-omni-flash
      - qwen3-omni-flash
      - fed/audio-asr

  claim_requirements:
    material_claims:
      require_time_range: true
      require_evidence_id: true
      require_epistemic_class: true
    inferred_claims:
      max_confidence: 0.80
    causal_claims_without_external_validation:
      max_confidence: 0.70

  sampling_ladder:
    pass_a_reconnaissance: captions + sparse storyboard + shot boundaries
    pass_b_retrieval: scene-level multimodal search
    pass_c_verification: dense frames around candidate window (≤2 fps)
    pass_d_escalation: native-res frames, OCR retry, alternate ASR, human review
