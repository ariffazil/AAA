  keep_if_differ: [authority_boundary, input_modality, safety_consent_boundary, side_effects, output_contract, failure_semantics, runtime_dependency]
  collapse_if_only_differs: [prompt_wording, domain_label, tone_persona]

anti_bloat_law: >
  Before creating or preserving any skill, find the existing owner. If an owner exists,
  patch the owner. New skill only when authority, side effects, or runtime contract
  are genuinely different.

