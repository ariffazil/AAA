# HAProxy — FED Gateway with auth injection (2026-08-09)
#
# Two fixes in one config:
# 1. Health check uses REAL LITELLM_MASTER_KEY (not placeholder)
# 2. http-request set-header injects master key into ALL backend requests
#    → OpenClaw/Claude Code/any client works without sending Authorization
#
# Deploy: cp this to /etc/haproxy/haproxy.cfg (after replacing KEY placeholder)
#         haproxy -f /etc/haproxy/haproxy.cfg -c && systemctl reload haproxy
# Verify: curl -s http://127.0.0.1:4000/v1/chat/completions \
#           -H "Content-Type: application/json" \
#           -d '{"model":"hermes-asi","messages":[{"role":"user","content":"hi"}],"max_tokens":5}'
#         (NO Authorization header — should return 200)

global
    log /dev/log local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend fed_gateway
    bind 127.0.0.1:4000
    default_backend llm_nodes

backend llm_nodes
    # ── AUTH INJECTION ──────────────────────────────────────────────
    # Inject master key for ALL requests (not just health checks).
    # This fixes 401 for OpenClaw/Claude Code that don't send auth.
    # Replace REAL_KEY with actual LITELLM_MASTER_KEY value.
    http-request set-header Authorization "Bearer REAL_KEY"

    # Health check with auth
    option httpchk GET /health
    http-check send hdr Authorization "Bearer REAL_KEY"
    http-check expect status 200

    # Primary: Full FED proxy (litellm-federation :4011)
    server fed_primary 127.0.0.1:4011 check inter 2s fall 2 rise 2

    # Backup: Escape proxy (DeepSeek + MiMo only, litellm-escape :4012)
    server escape_backup 127.0.0.1:4012 check inter 2s fall 2 rise 2 backup
