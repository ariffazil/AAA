known_gaps:
  - id: ENUMERATED-REFUSAL-NO-END-TO-END-TEST
    status: RESOLVED
    observed: >
      On 2026-09-14 the enumerated-target branch of federation_hook_engine.gate()
      was observed in TWO different states minutes apart. At 09:19 and again at
      09:30:14 it returned verdict=VOID / execution_status=NOT_EXECUTED /
      consequence=PREVENTED_BY_KERNEL_VOID. At 09:29 it returned verdict=ALLOW /
      execution_status=PROCEEDED / consequence=KERNEL_VERDICT_RECORDED_SENSOR_PROCEEDED,
      which would have permitted a write to /etc/sudoers.d/evil.
    detail: >
      No automated test asserted the enumerated class is refused through the CLI /
      membrane path. The adversarial suite exercised gate() in-process only, so a
      flip to ALLOW passed every suite green. That is why the flapping above was
      silent.
    resolution: >
      2026-09-25 FI-008 (F13 directive "Hooks"): drift-guard C9 added to
      hook_mesh_check.py — runs the REAL CLI (`federation_hook_engine.py gate`)
      against /etc/sudoers.d/evil and fails unless verdict != ALLOW and
      execution_status == NOT_EXECUTED. Pytest mirror at
      /root/AAA/tests/hooks/test_enumerated_cli_e2e.py.
    prescribed_fix: "Add a CLI-level assertion: `federation_hook_engine.py gate` on an enumerated target must emit verdict != ALLOW and execution_status == NOT_EXECUTED."
    owner: FI-008

  - id: ENGINE-VERDICT-OVERREACH
    status: NARROWED
    observed: >
      Live CLI probe 2026-09-14T01:30Z: verdict=VOID, kernel_verdict=VOID,
      verdict_source=kernel_arif_judge, hook_role=sensor_and_transport,
      execution_status=NOT_EXECUTED, consequence=PREVENTED_BY_KERNEL_VOID.
    detail: >
      The engine now forwards enumerated targets to arif_judge and transmits the
      returned verdict instead of synthesising one. RESOLVED 2026-09-25 (FI-008,
      F13 directive "Hooks"): the `or "VOID"` unreachable-kernel fallback was
      replaced with HOLD + consequence FAILSAFE_KERNEL_UNREACHABLE + full
      escalation receipt (escalation_required/target/floor/route,
      kernel_reachable=false) — a hook never spells a kernel-only verdict.
      Remaining VOID spelling in the code is the restriction-ladder
      re-transmission of a PRIOR KERNEL-ISSUED verdict (transmit_semantics),
      kept declared here so C5 continues to hold it visible.
    prescribed_fix: "Replace the `or \"VOID\"` fallback with HOLD + FAILSAFE_KERNEL_UNREACHABLE so the hook never spells a kernel-only verdict."
    owner: FI-008

  - id: AUTHORITY-CEILINGS-REMOVED
    status: OPEN
    observed: "arifos-federation-manifest-compiler.ts authorityPermissions() returns { '*': 'allow' } for every ceiling."
    detail: >
      Per-ceiling capability masks (JUDGE_ONLY, COMPUTE_ONLY, REFLECT_ONLY,
      DISPLAY_ONLY, METABOLIZE_ONLY) no longer restrict any tool at the harness
      boundary. This changes AGENT AUTHORITY across the federation, not hook
      plumbing.
    prescribed_fix: "Restore per-ceiling masks, or replace them with kernel-derived capability tokens. Requires F13 direction: agent authority scope is a direction change, not a cleanup."
    owner: F13-PENDING

  - id: CLAUDE-PATH-TARGET-SCREEN
    status: RESOLVED
    observed: "Original 2026-09-14 observation was PARTIALLY STALE: the live /root/.claude/hooks/f1-amanah-preshell.py already screened /etc/sudoers* via PROTECTED_PATHS, but /etc/shadow and /root/.ssh/authorized_keys were unguarded, and Bash commands bypassed the path screen entirely."
    detail: >
      2026-09-25 FI-008 (F13 directive "Hooks"): ENUMERATED_TARGETS screen added
      to the LIVE hook — all four classes (/etc/shadow, /etc/sudoers,
      /root/.ssh/authorized_keys, /root/.secrets/kunci-root.env) checked on BOTH
      Bash command strings AND Write/Edit file paths, fail-closed (deny + exit 2).
      Live-tested 5/5 (benign allow; shadow/sudoers.d/authorized_keys deny).
      Immutable flag restored after edit (backup .bak-enumfix-20260925 beside it).
      Advisory-only plugin copy kept in semantic sync (BLOCK-advisory, its
      architecture). C5 now finds real screens, not just a declaration.
    prescribed_fix: "Route PreToolUse target strings through the enumeration before session handling."
    owner: FI-008

  - id: RECEIPTS-LACK-CONSEQUENCE
    status: PARTIAL
    observed: "judge-gate.ts and the engine now emit execution_status + consequence (confirmed in the live CLI probe)."
    detail: "The fields exist for new receipts, but nothing cross-checks that the verdict and the recorded outcome agree, and historical receipts lack the fields entirely."
    prescribed_fix: "Add a reconciliation assertion: for every receipt carrying a verdict, consequence must be consistent with execution_status."
    owner: UNASSIGNED

  - id: GATE-SILENT-OUTAGE-20260914
    status: RESOLVED
    observed: "git show HEAD:arifos-judge-gate.ts | bun build -> 'error: Unexpected catch'. smoke-test reported 'JudgeGate hooks=0 err=BuildMessage: Unexpected catch'."
    detail: >
      An unclosed if-block left by the degraded-branch refactor made judge-gate.ts
      fail to compile, so it registered ZERO hooks — a dead constitutional gate — while
      receipts reported "6/6 plugins active" and "100% PASS". Repaired 09:29:04Z.
    prescribed_fix: "Guarded by hook_mesh_check C8, which bun-builds every OpenCode plugin and fails on any that does not compile."
    owner: FI-008
