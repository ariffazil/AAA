# =============================================================================
# SEPARATION OF POWERS — WHO MAY REFUSE
# =============================================================================
# Four distinct layers. Only two of them may refuse an action.
#
#   1. HOOK MESH      (this spec)   → OBSERVE, ENRICH, TRACE, HEAL, ESCALATE,
#                                     and TRANSMIT a kernel verdict into the
#                                     enforcement point (Policy Enforcement).
#                                     MAY NOT decide (Policy Decision).
#   2. KERNEL         (arifOS :8088) → JUDGE. Sole issuer of constitutional
#                                     verdicts: ALLOW / HOLD / VOID / REVOKED.
#   3. EXECUTION MEMBRANE (harness permission layer, A-FORGE ArifJudge)
#                                    → ENFORCE. Applies the kernel verdict at the
#                                     side-effect boundary. This is the only place
#                                     a tool call may actually be stopped.
#   4. SOVEREIGN      (F13 / Arif)   → outside the machine.
#
# THE CRITICAL DISTINCTION (earned 2026-09-14): "the hook must not JUDGE" does NOT
# mean "nothing enforces". A hook that records a kernel VOID and then proceeds makes
# the judge a commentator and the ledger an assertion of governance that never
# happened. Transmitting the kernel's decision into the boundary is ENFORCEMENT, not
# JUDGEMENT — a firewall applying a policy is not the policy author.
#
# ENUMERATED FAIL-SAFE CLASSES (non-discretionary, fixed list). A hook may DEFER or
# TRANSMIT a refusal on exactly these; it may never invent one, and it may never
# convert a kernel refusal into an allow.
#   - /etc/shadow
#   - /etc/sudoers            (and /etc/sudoers.d/*)
#   - /root/.ssh/authorized_keys
#   - /root/.secrets/kunci-root.env
# Off-list targets receive NO hook-originated refusal of any kind.

separation_of_powers:
  may_observe: [hook_mesh]
  may_judge: [kernel]
  may_enforce: [execution_membrane]
  may_annul: [kernel, sovereign]
  hook_forbidden_verdicts: ["VOID", "DENY", "REVOKED"]
  hook_permitted_outcomes: ["ALLOW", "ALLOW_WITH_CONSTRAINTS", "HOLD"]
  hold_semantics: "HOLD emitted by a hook means 'defer to kernel', never 'this action is annulled'. Escalation receipt is mandatory."
  transmit_semantics: "A hook MUST carry the kernel's verdict to the enforcement point unchanged. Overriding a kernel refusal with ALLOW is a governance defect, not a reading of the sensor doctrine."
  escalation_receipt_fields: ["escalation_required", "escalation_target", "escalation_floor", "escalation_route", "kernel_reachable"]

core_properties:
  monotonicity_ladder:
    order:
      - "ALLOW"
      - "ALLOW_WITH_CONSTRAINTS"
      - "OBSERVE_ONLY"
      - "DEFER"
      - "HOLD"
      - "DENY"
      - "VOID"
      - "REVOKED"
    law: "Downstream hooks or sibling agents can never downgrade a restriction level once asserted. Only an authenticated human override creates a new decision lineage."
    scope_note: "The ladder is TRACKED STATE held by the hook mesh. It is not an enforcement mechanism. Only the kernel issues the verdicts at ranks DENY and above."

  universal_hook_contracts:
    must_emit:
      - receipt_hash
      - floor_passed
      - delta_entropy_dS
    must_label:
      - authority_ceiling
      - reversibility_class
      - truth_class
    must_escalate_on:
      - F1_missing_snapshot
      - F11_no_receipt
      - F4_entropy_positive
      - F13_sovereign_boundary_breach
    must_not:
      - issue a constitutional verdict
      - terminate the agent process for an ordinary reversible action
      - convert a kernel refusal into an allow
      - claim an execution outcome the hook cannot observe

canonical_lifecycle_events:
  1.aaa.session.opened:
    description: "Session ignition, schema validation, token binding, and active scar hydration."
    must_escalate: false
    core_outputs: ["context_brief", "policy_version", "memory_snapshot_id"]
    hooks: ["scar-bootstrap", "kernel-bridge", "autonomy-reset"]

  2.aaa.turn.received:
    description: "Intake screening, provenance marking, and prompt injection quarantine."
    must_escalate: false
    core_outputs: ["provenance_trust", "task_class", "max_permitted_risk"]
    hooks: ["intake-screening", "instruction-quarantine"]

  3.aaa.action.proposed:
    description: "Pre-execution sensing: capability check, enumerated-target detection, rollback entry. Transmits the kernel verdict to the enforcement point."
    must_escalate: true
    escalation_condition: "enumerated fail-safe class matched, or kernel unreachable while action class >= EXTERNAL_DRAFT"
    core_outputs: ["verdict", "escalation_receipt", "capability_token_id", "rollback_journal_id"]
    hooks: ["envelope-check", "authority-band", "scar-propose", "auto-heal-preview"]

  4.aaa.action.completed:
    description: "Post-execution telemetry, postcondition verification, outcome receipt."
    must_escalate: false
    core_outputs: ["receipt_hash", "exit_class", "delta_entropy_dS", "execution_status", "consequence"]
    hooks: ["audit-receipt", "entropy-delta", "fq-update"]

  5.aaa.action.failed:
    description: "Failure taxonomy classification, allowlist matching, and bounded repair candidate generation."
    must_escalate: false
    core_outputs: ["failure_signature", "repair_candidate", "auto_retry_eligible"]
    hooks: ["failure-classifier", "scar-ingest", "repair-router"]

  6.aaa.turn.idle:
    description: "Turn-level epistemic metabolism, Anti-Tangguh Sentry, and bounded L3 learning apply."
    must_escalate: false
    core_outputs: ["turn_rsi_hash", "learning_signal", "anti_tangguh_status"]
    hooks: ["turn-rsi", "auto-heal-decide", "recursive-improvement-apply"]

  7.aaa.context.compacting:
    description: "Context window compaction with scar compression and invariant retention."
    must_escalate: false
    core_outputs: ["scar_delta", "retained_state_hash"]
    hooks: ["scar-compress", "autonomy-inject"]

  8.aaa.session.sealing:
    description: "Session closure, generational carry-forward append, and immutable ledger seal."
    must_escalate: false
    core_outputs: ["carry_forward_hash", "seal_id", "vault_hash"]
    hooks: ["carry-forward-emit", "safety-seal"]

  9.aaa.policy.violation:
    description: "Constitutional boundary or integrity breach detected. Raises an escalation ticket; the KERNEL halts, not the hook."
    must_escalate: true
    escalation_condition: "always — route to kernel and human witness"
    core_outputs: ["violation_code", "escalation_ticket", "hold_state"]
    hooks: ["security-tripwire", "human-witness-request"]

