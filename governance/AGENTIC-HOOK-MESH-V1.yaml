# AGENTIC-HOOK-MESH-V1.yaml — Universal Agentic Hook Mesh Specification
# Canonical Path: /root/AAA/governance/AGENTIC-HOOK-MESH-V1.yaml
# Governs: OpenCode (FI-001), Claude Code (FI-002), Antigravity (FI-009), Hermes (FI-007), OpenClaw (FI-004), Kimi (FI-008), Qwen (FI-003)
# Constitutional Authority: F1 Amanah, F2 Truth, F4 Clarity (ΔS ≤ 0), F8 Simpler Path, F11 Audit, F13 Sovereign Attention Preservation
# Standard: Prompt Version AAA-HOOK-FORGE-V1.0
#
# v1.3.0 (2026-09-14) — SEPARATION-OF-POWERS CORRECTION (FI-008, sovereign directive
#   APEX-ZEN-HOOK-DEFUSE-20260914). Prior versions declared `must_block_on` and
#   `must_block: true`, asserting that hooks deny. They do not. This revision states
#   which layer may refuse, and removes every claim that a hook is a judge or a BOP.

version: "1.3.0"
schema_id: "arifos.governance.agentic_hook_mesh.v1"
last_updated: "2026-09-14T01:30:00Z"
doctrine: "DITEMPA BUKAN DIBERI — Governed emergence across all federation warga."

# =============================================================================
# SEPARATION OF POWERS — WHO MAY REFUSE
# =============================================================================
# Four distinct layers. Only two of them may refuse an action.
#
#   1. HOOK MESH      (this spec)   → OBSERVE, ENRICH, TRACE, HEAL, ESCALATE
#                                     MAY NOT refuse. Emits a verdict field that is
#                                     informational to the harness only.
#   2. KERNEL         (arifOS :8088) → JUDGE. Sole issuer of constitutional
#                                     verdicts: ALLOW / HOLD / VOID / REVOKED.
#   3. EXECUTION MEMBRANE (harness permission layer, A-FORGE ArifJudge)
#                                    → ENFORCE. Applies the kernel verdict at the
#                                     side-effect boundary. This is the only place
#                                     a tool call may actually be stopped.
#   4. SOVEREIGN      (F13 / Arif)   → outside the machine.
#
# CONSEQUENCE FOR THIS SPEC: a hook entry may declare escalation requirements, never
# refusal. `must_block_on` was removed in v1.3.0 and replaced by `must_escalate_on`.
# Any hook that stops work is a defect, not a feature — unless it is enforcing one of
# the enumerated fail-safe classes below, which are DEFERRALS to the kernel, not
# verdicts.
#
# ENUMERATED FAIL-SAFE CLASSES (non-discretionary, fixed list — a firewall rule is not
# a judge). Derived from FORBIDDEN_MUTATION_TARGETS. A hook may DEFER (HOLD) — never
# annul (VOID) — on exactly these, and must emit an escalation receipt:
#   - /etc/shadow
#   - /etc/sudoers            (and /etc/sudoers.d/*)
#   - /root/.ssh/authorized_keys
#   - /root/.secrets/kunci-root.env
# Off-list targets receive NO hook-originated refusal of any kind.

separation_of_powers:
  may_observe: [hook_mesh]
  may_judge: [kernel]
  may_enforce: [execution_membrane]
  may_annul: [kernel, sovereign]
  hook_forbidden_verdicts: ["VOID", "DENY", "REVOKED"]
  hook_permitted_outcomes: ["ALLOW", "ALLOW_WITH_CONSTRAINTS", "HOLD"]
  hold_semantics: "HOLD emitted by a hook means 'defer to kernel', never 'this action is annulled'. Escalation receipt is mandatory."
  escalation_receipt_fields: ["escalation_required", "escalation_target", "escalation_floor", "escalation_route", "kernel_reachable"]

core_properties:
  monotonicity_ladder:
    order:
      - "ALLOW"
      - "ALLOW_WITH_CONSTRAINTS"
      - "OBSERVE_ONLY"
      - "DEFER"
      - "HOLD"
      - "DENY"
      - "VOID"
      - "REVOKED"
    law: "Downstream hooks or sibling agents can never downgrade a restriction level once asserted. Only an authenticated human override creates a new decision lineage."
    scope_note: "The ladder is TRACKED STATE held by the hook mesh. It is not an enforcement mechanism. Only the kernel issues the verdicts at ranks DENY and above."

  universal_hook_contracts:
    must_emit:
      - receipt_hash
      - floor_passed
      - delta_entropy_dS
    must_label:
      - authority_ceiling
      - reversibility_class
      - truth_class
    # v1.3.0: was `must_block_on`. Hooks escalate; the kernel and membrane refuse.
    must_escalate_on:
      - F1_missing_snapshot
      - F11_no_receipt
      - F4_entropy_positive
      - F13_sovereign_boundary_breach
    must_not:
      - issue a constitutional verdict
      - terminate the agent process
      - convert its own detection into an execution stop

canonical_lifecycle_events:
  1.aaa.session.opened:
    description: "Session ignition, schema validation, token binding, and active scar hydration."
    must_escalate: false
    core_outputs: ["context_brief", "policy_version", "memory_snapshot_id"]
    hooks: ["scar-bootstrap", "kernel-bridge", "autonomy-reset"]

  2.aaa.turn.received:
    description: "Intake screening, provenance marking, and prompt injection quarantine."
    must_escalate: false
    core_outputs: ["provenance_trust", "task_class", "max_permitted_risk"]
    hooks: ["intake-screening", "instruction-quarantine"]

  3.aaa.action.proposed:
    description: "Pre-execution sensing: capability check, enumerated-target detection, rollback entry. Emits escalation for the kernel; refuses nothing itself."
    must_escalate: true
    escalation_condition: "enumerated fail-safe class matched, or kernel unreachable while action class >= EXTERNAL_DRAFT"
    core_outputs: ["verdict", "escalation_receipt", "capability_token_id", "rollback_journal_id"]
    hooks: ["envelope-check", "authority-band", "scar-propose", "auto-heal-preview"]

  4.aaa.action.completed:
    description: "Post-execution telemetry, postcondition verification, outcome receipt."
    must_escalate: false
    core_outputs: ["receipt_hash", "exit_class", "delta_entropy_dS"]
    hooks: ["audit-receipt", "entropy-delta", "fq-update"]

  5.aaa.action.failed:
    description: "Failure taxonomy classification, allowlist matching, and bounded repair candidate generation."
    must_escalate: false
    core_outputs: ["failure_signature", "repair_candidate", "auto_retry_eligible"]
    hooks: ["failure-classifier", "scar-ingest", "repair-router"]

  6.aaa.turn.idle:
    description: "Turn-level epistemic metabolism, Anti-Tangguh Sentry, and bounded L3 learning apply."
    must_escalate: false
    core_outputs: ["turn_rsi_hash", "learning_signal", "anti_tangguh_status"]
    hooks: ["turn-rsi", "auto-heal-decide", "recursive-improvement-apply"]

  7.aaa.context.compacting:
    description: "Context window compaction with scar compression and invariant retention."
    must_escalate: false
    core_outputs: ["scar_delta", "retained_state_hash"]
    hooks: ["scar-compress", "autonomy-inject"]

  8.aaa.session.sealing:
    description: "Session closure, generational carry-forward append, and immutable ledger seal."
    must_escalate: false
    core_outputs: ["carry_forward_hash", "seal_id", "vault_hash"]
    hooks: ["carry-forward-emit", "safety-seal"]

  9.aaa.policy.violation:
    description: "Constitutional boundary or integrity breach detected. Raises an escalation ticket; the KERNEL halts, not the hook."
    must_escalate: true
    escalation_condition: "always — route to kernel and human witness"
    core_outputs: ["violation_code", "escalation_ticket", "hold_state"]
    hooks: ["security-tripwire", "human-witness-request"]

harness_hydration_map:
  opencode:
    manifest_path: "/root/.config/opencode/plugins/IPENCODE-HOOK-ORDER-MANIFEST.json"
    dispatcher: "TypeScript Plugin Suite with IPC bridge to federation_hook_engine.py"
    enforcement_owner: "opencode permission layer + arifos-judge-gate.ts (advisory routing)"
    event_mappings:
      session.created: { maps_to: "aaa.session.opened", fidelity: "native" }
      tool.execute.before: { maps_to: "aaa.action.proposed", fidelity: "native" }
      tool.execute.after: { maps_to: "aaa.action.completed", fidelity: "native" }
      permission.ask: { maps_to: "aaa.action.proposed", fidelity: "native" }
      session.idle: { maps_to: "aaa.turn.idle", fidelity: "native" }
      session.compacting: { maps_to: "aaa.context.compacting", fidelity: "native" }
      session.close: { maps_to: "aaa.session.sealing", fidelity: "native" }

  claude_code:
    manifest_path: "/root/AAA/plugins/claude-code-federation/hooks/hooks.json"
    dispatcher: "Python hook wrappers"
    enforcement_owner: "arifOS kernel verdict via f1-amanah-preshell.py"
    # NOTE (FI-008, 2026-09-14): f1-amanah-preshell.py declares NO forbidden-target
    # screen. The enumerated fail-safe classes are NOT checked on this path. Tracked
    # gap: CLAUDE-PATH-TARGET-SCREEN.
    event_mappings:
      SessionStart: { maps_to: "aaa.session.opened", fidelity: "native" }
      UserPromptSubmit: { maps_to: "aaa.turn.received", fidelity: "native" }
      PreToolUse: { maps_to: "aaa.action.proposed", fidelity: "native" }
      PostToolUse: { maps_to: "aaa.action.completed", fidelity: "native" }
      PostToolUseFailure: { maps_to: "aaa.action.failed", fidelity: "native" }
      Stop: { maps_to: "aaa.turn.idle", fidelity: "native" }
      PreCompact: { maps_to: "aaa.context.compacting", fidelity: "native" }
      SessionEnd: { maps_to: "aaa.session.sealing", fidelity: "native" }

  antigravity:
    manifest_path: "/root/AAA/registries/antigravity/hooks.json"
    dispatcher: "CLI dispatch calls to federation_hook_engine.py"
    enforcement_owner: "harness honours the CLI gate output — CLI is the membrane on this path"
    event_mappings:
      on_session_start: { maps_to: "aaa.session.opened", fidelity: "derived" }
      pre_tool_call: { maps_to: "aaa.action.proposed", fidelity: "derived" }
      post_tool_call: { maps_to: "aaa.action.completed", fidelity: "derived" }
      post_file_edit: { maps_to: "aaa.action.completed", fidelity: "derived" }
      session_idle: { maps_to: "aaa.turn.idle", fidelity: "derived" }
      on_session_close: { maps_to: "aaa.session.sealing", fidelity: "derived" }

  hermes:
    manifest_path: "/root/AAA/agents/hermes-asi/hooks/arifflow-hook/HOOK.yaml"
    dispatcher: "shell_hooks.py + arifFlow :7073 ingest"
    enforcement_owner: "arifOS kernel verdict"
    event_mappings:
      agent:start: { maps_to: "aaa.session.opened", fidelity: "native" }
      agent:end: { maps_to: "aaa.session.sealing", fidelity: "native" }

  openclaw:
    manifest_path: "/root/AAA/federation/protocols/openclaw-hook-design.md"
    dispatcher: "Telegram edge middleware calling federation_hook_engine.py gate"
    enforcement_owner: "arifOS kernel verdict"
    event_mappings:
      inbound_message: { maps_to: "aaa.turn.received", fidelity: "simulated" }
      pre_mutation: { maps_to: "aaa.action.proposed", fidelity: "simulated" }

# =============================================================================
# KNOWN GAPS — declared, not hidden
# =============================================================================
known_gaps:
  - id: ENGINE-VERDICT-OVERREACH
    status: OPEN
    detail: >
      hooks/lib/federation_hook_engine.py returns verdict=VOID on the enumerated
      fail-safe classes, and again when the tracked ladder reaches VOID. Both blocks
      are self-annulling: only the kernel may issue VOID. The same function's own
      comments state the opposite intent ("advisory enrichment, not blocking",
      "context only — hook doesn't block"), so the file contradicts itself.
    prescribed_fix: "Return HOLD + escalation receipt (defer-to-kernel) instead of VOID; drop the false execution_status assertion."
    owner: FI-008
  - id: CLAUDE-PATH-TARGET-SCREEN
    status: OPEN
    detail: "f1-amanah-preshell.py performs session binding but screens no forbidden target, so the enumerated fail-safe classes are unguarded on the Claude Code PreToolUse path."
    prescribed_fix: "Route PreToolUse target strings through the enumeration before session handling."
    owner: UNASSIGNED
  - id: RECEIPTS-LACK-CONSEQUENCE
    status: OPEN
    detail: "opencode_receipts.jsonl records decisions only. No outcome / execution_status / file_delta field exists (0 occurrences in 84,277 receipts), so no receipt can prove a verdict was honoured."
    prescribed_fix: "Add execution_status + consequence to every receipt; assert verdict/outcome agreement."
    owner: UNASSIGNED
