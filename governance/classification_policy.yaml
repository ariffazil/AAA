# ─── ORGAN-LEVEL OVERRIDES ───
# Some organs have a hard authority ceiling that overrides verb classification.
# Even if a tool name suggests MUTATE, the organ's ceiling restricts it.

organ_overrides:
  GEOX:
    authority_ceiling: "COMPUTE_ONLY"
    max_class: "OBSERVE"
    note: "geox_claim(mode=seal) is OBSERVE despite name — seal requires arifOS"

  WEALTH:
    authority_ceiling: "COMPUTE_ONLY"
    max_class: "OBSERVE"
    exception:
      - tool: "capital_ledger"
        mode: "write"
        class: "MUTATE"
        note: "Requires human acknowledgment. Writes to vault receipt, not VAULT999."

  WELL:
    authority_ceiling: "REFLECT_ONLY"
    max_class: "OBSERVE"
    note: "well_guard_dignity is REFLECT, not GOVERN — WELL cannot adjudicate"

  AAA:
    authority_ceiling: "DISPLAY_ONLY"
    max_class: "GOVERN"
    note: "aaa_dispatch_a2a is GOVERN (routes), aaa_organ_probe is OBSERVE"

  arifFlow:
    authority_ceiling: "METABOLIZE_ONLY"
    max_class: "MUTATE"
    note: "flow_ingest writes to metabolic ledger, not governed state"

  FLAME:
    authority_ceiling: "ADVISORY"
    max_class: "OBSERVE"

  FED:
    authority_ceiling: "ADVISORY"
    max_class: "GOVERN"

# ─── MODE-AWARE OVERRIDES ───
# Some tools change class depending on their `mode` parameter.
# These are applied AFTER verb rules but BEFORE organ ceiling.

mode_overrides:
  - tool: "forge_filesystem"
    modes:
      read: "OBSERVE"
      list: "OBSERVE"
      search: "OBSERVE"
      write: "MUTATE"
      delete: "MUTATE"
      move: "MUTATE"

  - tool: "forge_postgres"
    modes:
      query: "OBSERVE"
      schema: "OBSERVE"
      mutate: "MUTATE"

  - tool: "forge_git"
    modes:
      status: "OBSERVE"
      diff: "OBSERVE"
      log: "OBSERVE"
      commit: "MUTATE"
      push: "MUTATE"

  - tool: "forge_docker"
    modes:
      ps: "OBSERVE"
      logs: "OBSERVE"
      images: "OBSERVE"
      exec: "MUTATE"

  - tool: "forge_vault"
    modes:
      read: "OBSERVE"
      list: "OBSERVE"
      write: "MUTATE"
      receipt: "SEAL"

  - tool: "forge_reality_loop"
    modes:
      start: "MUTATE"
      advance: "MUTATE"
      record: "MUTATE"
      report: "OBSERVE"
      metrics: "OBSERVE"
      list: "OBSERVE"
      destroy: "MUTATE"

  - tool: "forge_ephemeral"
    modes:
      inspect_gap: "OBSERVE"
      list_templates: "OBSERVE"
      list_active: "OBSERVE"
      generate: "MUTATE"
      sandbox_test: "MUTATE"
      invoke: "MUTATE"
      verify: "GOVERN"
      retire: "MUTATE"
      propose_promotion: "GOVERN"

  - tool: "forge_session_init"
    modes:
      init: "GOVERN"
      validate: "OBSERVE"

  - tool: "capital_ledger"
    modes:
      read: "OBSERVE"
      query: "OBSERVE"
      write: "MUTATE"

# ─── CLASSIFICATION ALGORITHM ───
# Applied in this order:
#
# 1. Extract verb from tool name (tokenize on _ and -)
# 2. Check mode_overrides (if tool has mode parameter)
# 3. Match verbs against verb_rules (SEAL → GOVERN → MUTATE → OBSERVE)
# 4. Apply organ_overrides (cap at organ's authority_ceiling)
# 5. Default: OBSERVE
#
# Any tool not classified → OBSERVE (fail-safe)

algorithm:
  version: "1.0"
  steps:
    - "tokenize tool name by '_' and '-'"
    - "if tool has mode param, check mode_overrides first"
    - "match tokens against SEAL verbs → if match, class=SEAL"
    - "match tokens against GOVERN verbs → if match, class=GOVERN"
    - "match tokens against MUTATE verbs → if match, class=MUTATE"
    - "match remaining patterns for each class"
    - "apply organ authority_ceiling cap"
    - "default: OBSERVE"

# ─── GOVERNANCE ───
# This policy document IS the constitutional source of truth for tool classification.
# The mcp_inventory.json is GENERATED from this policy, not maintained by hand.
# Changing a tool's class requires changing THIS policy, not the inventory.

governance:
  authority: "F13 SOVEREIGN"
  mutation_gate: "888_HOLD"
  review_trigger: "Any new organ or MCP server added to federation"
  staleness_check: "forge_surface_guard check → detect tools not covered by policy"
