# ─── METADATA ───
policy:
  id: "classification-policy-v1.0"
  forged: "2026-08-10T04:55:00Z"
  forged_by: "333-AGI"
  reviewed_by: "888-APEX"
  authority: "F13 SOVEREIGN ratification required for mutation of this policy"
  protocol_baseline: "2026-07-28"
  gap_resolved: "G5 — Tool classification authority source"

# ─── THE FOUR CLASSES ───
classes:
  OBSERVE:
    id: 0
    description: "Read-only. No side effects. May be stateless."
    session_required: false
    reversible: true
    authority_floor: "NONE"
    
  GOVERN:
    id: 1
    description: "Gate, route, judge, evaluate. Controls what CAN happen."
    session_required: true
    reversible: true
    authority_floor: "OBSERVE_ONLY"

  MUTATE:
    id: 2
    description: "Changes state. Files, DB, shell, deploy. Requires lease."
    session_required: true
    reversible: false
    authority_floor: "LIMITED_MUTATE"

  SEAL:
    id: 3
    description: "Immutable append to VAULT999. Highest authority."
    session_required: true
    reversible: false
    authority_floor: "FULL_MUTATE"

# ─── VERB-BASED CLASSIFICATION ───
# Applied by tokenizing tool name and matching against these sets.
# First match wins. Order: SEAL > GOVERN > MUTATE > OBSERVE.

verb_rules:
  SEAL:
    verbs:
      - seal        # forge_seal, arif_seal
      - attest      # federation_release_attestation
      - vault_append
    patterns:
      - "_seal$"
      - "_sealed$"
      - "visual_seal"

  GOVERN:
    verbs:
      - judge       # arif_judge, forge_judge_proxy
      - witness     # forge_witness
      - evaluate    # forge_evaluate
      - route       # arif_route, fed_route
      - lease       # forge_lease
      - lock        # forge_lock
      - policy      # forge_policy
      - authorize
      - gate        # apex_verdict_*, apex_floor_check
      - audit       # forge_surface_audit (governance audit)
      - guard       # forge_surface_guard
      - register    # forge_register (governance gate)
      - encode      # forge_apex_encode
      - recompute   # forge_apex_recompute
      - emd         # forge_apex_emd
      - tier_bind
      - govern      # forge_check_governance
      - init        # arif_init, forge_session_init
      - bind        # kernel_bind
    patterns:
      - "^arif_init$"
      - "^arif_judge"
      - "^arif_route$"
      - "_governance$"
      - "_governance_check$"
      - "_gate$"
      - "_auth_"

  MUTATE:
    verbs:
      - write       # forge_filesystem(write), forge_skillstore_write
      - edit        # (native edit tool)
      - update      # forge_apex_metabolize (updates state)
      - execute     # forge_execute, forge_shell
      - commit      # forge_git_commit
      - push        # forge_git(push)
      - create      # forge_skill, forge_github_create_*
      - delete      # forge_filesystem(delete), forge_sandbox_evict
      - restart     # deploy/restart
      - deploy      # forge_execute_sealed (deploy path)
      - apply       # supabase_apply_migration
      - merge       # supabase_merge_branch
      - send        # forge_send_confirm, forge_gmail(send)
      - transfer    # forge_transfer_confirm
      - spawn       # forge_parallel, openrouter_spawn
      - generate    # openrouter_generate-*, forge_skill
      - synthesize  # forge_synthesize
      - stage       # forge_stage
      - ingest      # arifflow_flow_ingest, forge_document_ingest(chunk)
      - mutate
      - click       # forge_browser_click
      - type        # forge_browser_type
      - navigate    # forge_browser_navigate
      - canonize    # forge_canonize
      - metabolize  # forge_apex_metabolize
      - pause       # forge_sandbox_pause
      - resume      # forge_sandbox_resume
      - evict       # forge_sandbox_auto_evict
      - retire      # forge_ephemeral(retire)
      - index       # codebase-memory_index_repository (mutates graph)
      - migrate     # supabase_apply_migration
      - rebase      # supabase_rebase_branch
      - reset       # supabase_reset_branch
      - install     # openrouter_install-*
      - transcribe  # openrouter_transcribe-audio
      - download    # free-search_download
      - remove      # megamemory_remove_concept
      - resolve     # megamemory_resolve_conflict (mutates graph)
    patterns:
      - "_write$"
      - "_create$"
      - "_delete$"
      - "_deploy$"
      - "_execute"
      - "_mutate"
      - "^forge_shell$"
      - "^forge_git$"
      - "^forge_docker$"
      - "^forge_browser_"

  OBSERVE:
    # DEFAULT: any tool not matching above rules falls here
    verbs:
      - get         # forge_github_get_file, megamemory_get_concept
      - list        # forge_registry(list), supabase_list_tables
      - search      # forge_search, capability_search, free-search_search
      - query       # forge_postgres(query), context7_query-docs
      - recall      # forge_memory(recall)
      - status      # forge_status, forge_registry_status
      - health      # forge_health_check, hermes_health
      - metrics     # forge_netdata_metrics, forge_wm_stats
      - inspect     # forge_document_ingest(analyze)
      - scan        # forge_scan, forge_security_drift_scan
      - probe       # forge_probe, aaa_organ_probe
      - fetch       # forge_fetch, free-search_fetch
      - read        # forge_filesystem(read), forge_skillstore_read
      - view        # geox_well(view)
      - check       # forge_fingerprint_check, hermes_fact_check
      - verify      # forge_verify_timeline, forge_runtime_verify
      - diagnose    # capital_diagnose, well_machine_diagnose
      - observe     # arif_observe
