---
project_name: A-FORGE
loglevel: error
analyses:
- analysis_name: A-FORGE-static-map
  source_directory: /root/A-FORGE
  only_permit_languages:
  - py
  only_permit_file_extensions:
  - .py
  ignore_directories_containing: [__pycache__, .venv, .git, node_modules, build, dist, .ua, 00_legacy_materials, arifos_park, kernel, .opencode, .agents, .claude, site-packages, .cursor, .github, docs, tests, examples, .pytest_cache, .ruff_cache, .mypy_cache, forge_work, .turbo]
  file_scan:
  - number_of_methods
  - source_lines_of_code
  - dependency_graph
  - louvain_modularity
  - fan_in_out
  export:
  - directory: /root/work/code-intel/emerge/A-FORGE
  - graphml
  - json
  - tabular_file
  - tabular_console_overall
