boundaries:
- arifOS kernel verbs (init/observe/think/route/memory/judge/forge/seal)
- HERMES canonical meaning tools
- CHRON prediction/verification ledger (temporal truth)
- WELL readiness primitives
- GEOX / WEALTH domain computation
- A-FORGE mutation primitives
- independent verifier + FRAME/witness (compiler cannot verify itself; producer cannot
  be sole witness)
- 888 JUDGE · 999 VAULT
