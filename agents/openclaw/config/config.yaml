version: 1

id: openclaw-agent
agent_id: openclaw

# Runtime configuration
runtime:
  gateway_port: 18789
  mode: local
  bind: lan

# Approval tiers
approval:
  route_tier: T1
  delegate_tier: T1
  exec_tier: T2
  destructive_tier: T3
  irreversible_tier: T3

# Host binding
host_binding:
  type: docker
  channels:
    - telegram
    - terminal
    - cli
  config_path: openclaw/

# Channels
channels:
  telegram:
    enabled: true
    dm_policy: allowlist
    group_policy: open
    approval_policy: on-demand

  terminal:
    enabled: true
    approval_policy: none

  cli:
    enabled: true
    approval_policy: none

# MCP servers (gateway-proxied)
mcp_surface:
  - id: arifos-mcp
    url: http://arifosmcp:8080
    enabled: true

  - id: geox-mcp
    url: http://geox:8081
    enabled: false  # enable per-channel if needed

  - id: ariflow-mcp
    url: http://127.0.0.1:7073
    enabled: true
    description: "arifFLOW — Federation Metabolism Plane. FQ pulse, receipt tracking, cooling management."

# A2A peers
a2a_peers:
  - agent_id: opencode
    direction: bidirectional
    protocol: a2a-v1

  - agent_id: hermes
    direction: bidirectional
    protocol: a2a-v1

  - agent_id: arifos-kernel
    direction: send
    protocol: a2a-v1

  - agent_id: ariflow
    direction: send
    protocol: a2a-v1
    description: "arifFLOW metabolism plane — receive FQ pulse & receipt data"

# Allowed tools
allowed_tools:
  # Gateway operations
  - route
  - delegate
  - subscribe
  - cancel
  - send
  - receive
  - stream
  - vault999-write
  # arifOS Kernel MCP — constitutional governance access (canonical tool set)
  - arif_init          # was: arif_init — session ignition, F1-F13 binding
  - arif_observe       # was: arif_observe — reality observation & evidence gathering
  - arif_think         # was: arif_think — structured reasoning under F2/F7
  - arif_route         # was: arif_route — intent-to-organ dispatch
  - arif_judge         # was: arif_judge — 888 constitutional verdict
  - arif_forge         # ADDED: execution gate via A-FORGE
  - arif_seal          # ADDED: VAULT999 immutable append
  - arif_memory        # was: arif_memory_recall — governed L1-L6 semantic recall
  # Legacy custom tools retained for backward compatibility (no canonical equivalent)
  - arif_gateway_connect
  - arif_ops_measure
  - arif_critique
  - arif_reply_compose
  - arif_evidence_fetch

# Constitutional floors
floors:
  - F1  # AMANAH: no irreversible without consent
  - F2  # TRUTH: cite routing policy
  - F9  # ANTIHANTU: no consciousness claims
  - F12 # INJECTION: sanitize channel inputs
  - F13 # SOVEREIGNTY: human veto absolute

# Risk ceiling
max_risk_tier: medium
