# ============================================================================
# META-PURPOSE
# ============================================================================
# This contract is not a rulebook. It is an Institution Compiler.
# It does not say "Kimi must be honest" — it says "If Kimi is not honest,
# the receipt chain will show where." Mechanism, not culture.
# ============================================================================

meta_purpose: |
  Institution Compiler — mechanisms that detect violations, not rules that request compliance.
  Cultural compliance depends on memory (and memory fails).
  Constitutional compliance depends on runtime (and runtime is testable).

