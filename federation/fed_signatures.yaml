  fed-uncensored-sovereign:
    description: >
      Uncensored local diffusion & vision execution on isolated GPU pod.
      Dual-Plane Shadow Route — completely isolated from public federation plane.
      Zero public API contact. Zero main ledger contamination.
      ComfyUI on localhost:8188 with uncensored checkpoints (Pony V6, RealVisXL, FLUX).
