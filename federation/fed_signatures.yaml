# FED Capability Signatures — Declarative Spec
#
# Forged 2026-08-10 by 333-AGI under F13 directive "zen FED via Deterministic
# Latent-Aware Router". Lane B SESSION_RECEIPT ratification.
#
# Architecture: 3 orthogonal routing dimensions
#   1. modality        — text | pixel | mixed
#   2. task_class      — plan | generate | inspect | repair
#   3. fidelity_gate   — persist (≥0.88) | repair (<0.88 with bbox mask)
#
# Spec mapping (Deterministic Latent-Aware Router doctrine):
#   LLM (autoregressive)        → text + plan → fed-reasoning-heavy
#   DiT / SDXL (diffusion)      → pixel + generate → fed-image-generation
#   VLM (cross-attention)        → pixel + inspect → fed-grounded-vision
#   ControlNet / Inpainting      → pixel + repair → fed-inpainting

signatures:

  # ── EXISTING (preserved from fed_router.py v3.1 Zen) ────────────────
  fed-reasoning-heavy:
    description: "Heavy reasoning, coding, planning, constitutional judgment"
    modality: text
    task_class: plan
    constitutional_tier: 333
    models: [deepseek-v4-pro, qwen3.8-max, MiniMax-M3]
    spec_arch: LLM
    spec_role: planner
    fidelity_gate: null  # text plans don't have fidelity scores

  fed-multimodal-vision:
    description: "Image/video analysis, OCR, chart reading, screenshot inspection"
    modality: vision
    task_class: inspect
    constitutional_tier: 555
    models: [qwen-vl-max, mimo-v2.5, MiniMax-M3]
    spec_arch: VLM
    spec_role: inspector_generic

  fed-long-context:
    description: "Long documents, large context windows, multi-chunk processing"
    modality: text
    task_class: plan
    constitutional_tier: 333
    models: [MiniMax-M3, mimo-v2.5-pro, qwen3.8-max]

  fed-agent-subagent:
    description: "Subagent spawning, multi-step orchestration, DAG execution"
    modality: text
    task_class: plan
    constitutional_tier: 333
    models: [deepseek-v4-flash, qwen3.6-flash, mimo-v2.5]

  fed-realtime-voice:
    description: "Text-to-speech, speech-to-text, real-time audio"
    modality: audio
    task_class: plan
    constitutional_tier: 333
    models: [mimo-v2.5-tts, mimo-v2.5-asr]

  # ── NEW — Latent-Aware Routing (forged 2026-08-10) ──────────────────

  fed-image-generation:
    description: >
      Diffusion-based image synthesis. DiT / SDXL / Wan2.7 routes via ComfyUI.
      Spec role: Renderer / Executor. Iterative denoising on continuous
      spatial latents. Fails structurally (anatomical distortion, hand
      artifacts) — never semantically.
    modality: pixel
    task_class: generate
    constitutional_tier: 555
    models:
      primary: [bailian-token-plan/wan2.7-image-pro]
      fallback: [bailian-token-plan/wan2.7-image, qwen-token-plan-individual/wan2.7-image-pro]
    spec_arch: DiT
    spec_role: renderer
    failure_mode: structural_distortion
    perceptual_guard: fed-grounded-vision (post-flight)
    cost_band: B  # per-image, but Wan2.7 is cheap
    expected_latency_ms: [3000, 15000]
    constitutional_seat: false  # never a JUDGE

  fed-grounded-vision:
    description: >
      Compact VLM with spatial grounding (bbox protocol). Spec role:
      Inspector / Evaluator. Used both for standalone inspection AND as
      post-flight verifier for fed-image-generation. Returns bbox-tagged
      fidelity score P_quality in [0,1].
    modality: pixel
    task_class: inspect
    constitutional_tier: 555
    models:
      primary: [mulerouter/qwen-vl-max]
      fallback: [bailian-token-plan/qwen-vl-max, flame/gemini-2.5-flash]
    spec_arch: VLM
    spec_role: inspector_grounded
    failure_mode: visual_hallucination_spatial_blindness
    prompt_protocol: "object:{name} bbox:{x,y,w,h} score:{0-1}"
    output_schema:
      fidelity_score: float  # 0..1
      defects: list[BoundingBox]
      perception_summary: str
    constitutional_seat: true  # Lane B RECEIPT-verifier eligible

  fed-inpainting:
    description: >
      Targeted image repair via ControlNet / inpainting. Spec role:
      Closed-Loop Repair Dispatch. Triggered when fed-grounded-vision
      returns P_quality < 0.88 with localized defect bboxes. Re-runs the
      affected region only — NOT the full generation.
    modality: pixel
    task_class: repair
    constitutional_tier: 555
    models:
      primary: [comfyui/controlnet-inpaint]
      fallback: [comfyui/sdxl-inpaint]
    spec_arch: DiT_with_mask
    spec_role: repair_dispatch
    trigger_condition: "P_quality < 0.88 AND len(defects) > 0"
    input_contract:
      original_image_uri: str
      mask_bbox: list[float]  # [x, y, w, h] in [0,1] normalized
      defect_description: str
    constitutional_seat: false

  # ── SHADOW PLANE — Uncensored Local Runtime (forged 2026-08-10) ──────

  fed-uncensored-sovereign:
    description: >
      Uncensored local diffusion & vision execution on isolated GPU pod.
      NEVER routes to public cloud APIs. Telemetry isolated from main ledger.
      Network: localhost/Tailscale only (127.0.0.1:8188 on pod).
    modality: pixel
    task_class: generate
    domain: local_shadow_runtime
    isolation_level: SHADOW_STRICT
    constitutional_tier: 555
    cost_band: S  # Sovereign/Local — zero API cost
    models:
      primary: [local/pony-v6, local/realvisxl-v5, local/flux-uncensored]
      fallback: [local/sdxl-uncensored]
    spec_arch: DiT
    spec_role: shadow_renderer
    target_endpoint: "${SHADOW_COMFY_URL:-http://127.0.0.1:8188}"
    telemetry_ledger: "/root/.shadow/shadow_telemetry.jsonl"
    public_api_blocklist:
      - api.openai.com
      - dashscope.aliyuncs.com
      - api.anthropic.com
      - api.anthropic.com
      - generativelanguage.googleapis.com
      - api.cloudflare.com
    failure_mode: structural_distortion
    constitutional_seat: false
    guard: AAAShadowGuard  # enforcement via shadow_isolation.py

  # ── CASCADE RESCUE (also forged 2026-08-10) ────────────────────────

  fed-judge-deputy:
    description: >
      Backup JUDGE channels for constitutional seats when primary 4 fail.
      Routes same models (glm-5.2, qwen3.8-max) through bailian /
      qwen-individual channels — different transport, same architecture.
      Resolves JUDGE_SEAT_UNAVAILABLE cascades.
    modality: text
    task_class: plan
    constitutional_tier: 666
    models:
      primary: [bailian-token-plan/glm-5.2, bailian-token-plan/qwen3.8-max]
      fallback: [qwen-token-plan-individual/glm-5.2, qwen-token-plan-individual/qwen3.8-max]
    spec_arch: LLM
    spec_role: judge_deputy
    triggered_by: "JUDGE_SEAT_UNAVAILABLE from primary 4"
    confidence_floor: 0.95
    constitutional_seat: true
    amendment_required: AGENT_MODEL_MAP 666_JUDGE.allowed_models

  # ── LOCAL RUNTIME — Uncensored checkpoints, full audit (forged 2026-08-10) ──

  fed-local-uncensored:
    description: >
      Local GPU execution via ComfyUI (:8188). Uncensored checkpoints
      permitted (Pony V6, RealVisXL, FLUX, etc.). SINGLE LEDGER —
      every receipt emits to arifflow_receipts.jsonl with explicit
