# ── Repair Loop (Closed-Loop Dispatch Constants) ──────────────────────
repair_loop:
  fidelity_threshold: 0.88
  max_repair_attempts: 3
  escalation_policy: |
    1st repair → fed-inpainting with VLM-supplied bbox mask
    2nd repair → fed-inpainting with widened bbox (×1.5)
    3rd repair → escalate to F13 SOVEREIGN (re-roll whole generation requires ACK)
  ledger_on_persist: arifflow_receipts.jsonl
  receipt_steps: [Barrier, Execute, Verify, Seal]