# arifOS node identity SOT — human-facing names vs infrastructure IDs.
# Do not rename MagicDNS / hostname from this file. Terminals consume it.
# ART + time + truth + survival + reality are required fields.
schema: arifos.node_identity.v1
status: LIVE_PROJECTION
applied_to_terminal: true
applied_to_magicdns: false
sovereign: ARIF
org: arifOS
motto: DITEMPA BUKAN DIBERI

art:
  schema: art_binding.v0
  canonical_ref: /root/AAA/contracts/art_binding.canonical.yaml
  floors: [F1, F3, F11, F13]
  law: "ART is the runtime envelope. Node name is not authority."

time:
  tz: Asia/Kuala_Lumpur
  tz_label: MYT
  utc_offset: "+08:00"
  dst: false
  rule: "Declare MYT on every receipt. Survival is time-stamped or it did not happen."

truth:
  plane: court
  owner: arifOS kernel
  endpoint: http://100.64.0.2:8088/health
  identity_hash_field: identity_hash
  rule: "Truth is Court-measured. Terminals project; they do not mint identity."

survival:
  test_1_unplug: "runtime ignites from contract + code + config on another host"
  test_2_kill_workshop: "Court still has identity, memory L3-L6, registry, vault"
  test_3_new_agent: "new agent fills one instance yaml; no new ownership plane"
  workshop_forbidden: [identity.key, vault_write, telegram_token_sot]
  rule: "If the machine dies, the institution must still be reconstructable."

reality:
  rule: "Live probe beats nickname. hostname=forge is NOT forge-core."
  never_map:
    hostname_forge: forge-core   # Court drift
    kvm8: forge-core
    vps_1325122: forge-core

# Lookup order (first match wins): tailscale_ip, vps_id from srvNNNNNNN, machine_id, tailscale_name
# Never match short hostname "forge" to forge-core.
nodes:
  - ARIFOS_NODE_ID: "1946043"
    ARIFOS_NODE_NAME: forge-core
    ARIFOS_NODE_ROLE: execution-core
    kvm_plan: KVM4
    human_label: "KVM4 workshop"
    plane: workshop
    public_ip: 187.127.107.217
    ssh: "root@100.64.0.5:22"
    live:
      hostname: srv1946043
      tailscale_name: kvm4-forge
      tailscale_ip: 100.64.0.5
      machine_id: 35ee38653c2c4430afb8db57715754e1
      tag: tag:forge
    services_declared: [OpenCode, CCC, LiteLLM-runtime, OpenClaw-edge]
    services_not: [VAULT999_SOT, identity_SOT, AAA_judgment]
    art:
