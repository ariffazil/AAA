# hermes-nudges.yaml — Default nudge registry for hermes-nudge-injector.py
# ═══════════════════════════════════════════════════════════════════════════════
# Each nudge is a JSON/YAML row. The engine evaluates conditions in isolation.
# A nudge only costs tokens when its condition matches.
#
# Supported events:
#   pre_llm   — inject system message(s) before LLM call
#   pre_tool  — append guidance to tool intent context
#   post_llm  — transform final text before human UI
#
# Supported condition keys (AND-combined):
#   always: true
#   any_keyword: [list]
#   all_keywords: [list]
#   regex: "pattern"
#   tool_name: "name" or [list]
#   message_count_min: N
#   message_count_max: N
#
# DITEMPA BUKAN DIBERI

meta:
  version: "1.0.0"
  ratified_by: "F13 SOVEREIGN"
  doctrine: "/root/AGENTS.md §exe-receipt-discipline + §ZEN_EXECUTION_DOCTRINE"

nudges:
  # ═══════════════════════════════════════════════════════════════════════════
  # Nudge 1 — Pre-LLM Intake Gate (context setter)
  # ═══════════════════════════════════════════════════════════════════════════
  - id: intake
    event: pre_llm
    priority: 10
    condition:
      always: true
    inject_position: last
    text: |
      <NUDGE_INTAKE>
      Before responding:
      1. Fact question? → Answer direct, no preamble.
      2. Task request? → Classify autonomy tier: T1 auto-do, T2 announce, T3 HOLD.
      3. Casual chat? → Match human energy, 1–3 lines.
      4. F13 sovereign decision? → State judgment first, ask only at real boundary.
      5. Agent-to-agent / 888 / terminal / seal output? → Epistemic labels and [🦾ACT] receipts are allowed.
      </NUDGE_INTAKE>

  # ═══════════════════════════════════════════════════════════════════════════
  # Nudge 2 — Pre-Tool Falsification Gate (W_scar reminder)
  # ═══════════════════════════════════════════════════════════════════════════
  - id: falsify
    event: pre_tool
    priority: 10
    condition:
      any_of:
        - tool_name:
            - "forge_shell"
            - "bash"
            - "forge_execute"
            - "forge_git_commit"
            - "forge_postgres"
            - "forge_docker"
            - "forge_vault"
            - "forge_seal"
            - "mcp__aforge__forge_shell"
            - "mcp__aforge__forge_execute"
            - "mcp__aforge__forge_git_commit"
        - any_keyword:
            - "buat"
            - "tulis"
            - "patch"
            - "deploy"
            - "cari"
            - "execute"
            - "run"
            - "write"
            - "edit"
            - "restart"
            - "commit"
            - "push"
            - "rm"
            - "delete"
            - "drop"
            - "remove"
    inject_position: last
    text: |
      <NUDGE_FALSIFY>
      STOP. Before calling any tool:
      1. Does this touch production, money, health, legal, or W_scar? → Check source evidence first.
      2. Is it reversible? If NO → HALT and hold for 888 / sovereign veto.
      3. Is there a smaller capability that can do this? → Route to least power.
      </NUDGE_FALSIFY>

  # ═══════════════════════════════════════════════════════════════════════════
  # Nudge 3 — Post-LLM Collapse Gate (human-facing output)
  # ═══════════════════════════════════════════════════════════════════════════
  - id: collapse
    event: post_llm
    priority: 10
    condition:
      always: true
    transforms:
      - strip_labels: true
      - strip_receipt_blocks: true
      - strip_tables: true
      - strip_markdown_headings: false
      - collapse_blank_lines: true
    text: ""
