# 08_WORKFLOWS/aia_72h_cycle.yaml — AIA 72-hour cycle
# AIA = Agentic Impian Architecture
# AIA is a horizon layer BEFORE AAA (not a member of AAA).
# Forged 2026-08-15 by F13 SOVEREIGN directive

id: workflow.aia.72h
name: AIA 72-hour cycle (Agentic Impian Architecture)
type: reflection
trigger: cron("every 72h")
architecture: AIA
codename: 222-AIA
layer_position: pre-deliberation
runtime: hermes      # Hermes is the runtime driver; AIA is the architecture
mode: AIA           # AIA is the horizon layer's mode of operation

# Constitutional floors
constitutional_floors: [F1, F2, F11]

# Reversibility
reversible: true
blast_radius: low
authority_ceiling: OBSERVE

# ─── The 9 steps ───────────────────────────────────────────────────────────

steps:
  - id: wake_aia
    capability: arif_impian
    input: cron_ticker
    output: aia.instance
    description: "Wake AIA from idle. Hermes is the runtime; AIA is the architecture that runs."
    duration_ms: 200

  - id: rrr_snapshot
    capability: arif_observe
    mode: rrr
    produces: rrr://runtime/snapshot/<date>
    description: "RRR snapshot of the present. The ground truth for reality_anchor."
    duration_ms: 2000

  - id: scar_walk
    capability: arif_observe
    inputs:
      - scar_ledger          # 10_RECEIPTS/sesat
      - holds_log            # 10_RECEIPTS/human_envelope
      - repeated_failures    # 12_TESTS/constitutional
    produces: scar_panorama.yaml
    description: "Walk the scar ledger. Compile the failure topography."
    duration_ms: 5000

  - id: gap_scan
    capability: arif_observe
    inputs:
      - capability_inventory     # 06_CAPABILITIES/*
      - unused_skills            # 07_SKILLS/_retired
      - manual_work_ledger       # 05_POLICIES/observability
    produces: capability_gap_map.yaml
    description: "Scan for capability gaps. The opposite of skill graveyard."
    duration_ms: 15000

  - id: external_council
    capability: a2a
    parallel:
      - agent: external-council-A
        prompt: "Support | Challenge | Alternative | Risk"
      - agent: external-council-B
        prompt: "Support | Challenge | Alternative | Risk"
      - agent: external-council-C
        prompt: "Support | Challenge | Alternative | Risk"
    description: "Cross-challenge with external agents. No copy, only compare."
    duration_ms: 60000

  - id: handoff_to_aaa
    description: "AIA hands synthetic proposals to AAA. The horizon layer → the deliberation lanes."
    duration_ms: 100

  - id: synthesize
    lane: 333-AGI
    capability: arif_think
    produces: future_skill_candidates.yaml
    description: "333 synthesizes the proposals (now in AAA). Filter fantasy by Anti-Fantasy Safeguard. Entropy Budget wajib per proposal (entropy_cost, maintenance_cost, complexity_cost) dan jawapan Devil's Advocate (Jika impian ini bakal memusnahkan arifOS, bagaimana?) dalam receipt - tiada jawapan, tiada verdict."
    duration_ms: 30000

  - id: blindspot_ledger
    capability: arif_impian
    produces: 03_EUREKAS/BLINDSPOTS/BLIND-<date>-NN.yaml
    description: "Min 1 blindspot record per cycle: confidence, reason, missing_observation, review_after. Known unknowns."
    duration_ms: 10000

  - id: anti_hero_scan
    capability: arif_impian
    produces: founder_dependency.yaml
    description: "Keupayaan mana yang hanya wujud dalam kepala Arif dan belum diterjemahkan ke kod/doktrin? Merah = canonization priority."
    duration_ms: 10000

  - id: devils_advocate
    capability: arif_challenge
    verb: 444-challenge
    produces: devil_advocate_report.yaml
    prompt: "If this dream destroys arifOS, how would it do so?"
    description: |
      Devil's Advocate (EUREKA 6). Every proposal must pass through
      arif_challenge before being filed to 03_EUREKAS/FUTURE/. Structural,
      not narrative. Verdict: PASS | HOLD | REJECT.
    duration_ms: 5000

  - id: critique
    lane: 555-ASI
    capability: arif_memory
    produces: real_fantasy_diff.yaml
    description: "555 critiques the synthesis. Mark the GROUNDED vs FANTASY boundary."
    duration_ms: 15000

  - id: hold
    lane: 888-APEX
    produces: approved_proposals.yaml
    verdict: HOLD | PROMOTE | REJECT
    description: "888 holds. No execution. Only proposal-level approval."
    duration_ms: 5000

  - id: seal
    capability: arif_seal
    produces: 10_RECEIPTS/AIA/<date>.seal
    description: "Seal the cycle. The thinking trail is preserved."
    duration_ms: 1000

# ─── Anti-Fantasy Safeguard (binding) ────────────────────────────────────

anti_fantasy_safeguard:
  reject_if:
    - reality_anchor is null
    - scar_id is null
    - evidence_paths is empty
  quarantine_to: 03_EUREKAS/FANTASIES/
  log_to: 10_RECEIPTS/AIA/<date>.log

# ─── 8 EUREKAs — meta-constitutional additions ─────────────────────────────

entropy_budget:
  required_fields_per_proposal:
    entropy_cost: low | med | high
    maintenance_cost: "<runtime commitment, e.g. '2h/week'>"
    complexity_cost: "<+N edges to graph>"
  forge_777_must_refuse_if: entropy_cost > entropy_budget
  status: REQUIRED

r2r_metric:
  formula: "useful_proposals / total_proposals"
  thresholds:
    healthy: "> 0.6"
    normal: "0.2 - 0.6"
    overthinking: "< 0.2 for 3+ cycles"
  logged_in: 10_RECEIPTS/AIA/

anti_hero_trap:
  question: "What capability exists only inside ARIF?"
  thresholds:
    red: 0.7
    yellow: 0.4
    green: 0.4
  on_red: "schedule F13 transfer briefing"
  on_yellow: "accelerate canonization"
  logged_in: 10_RECEIPTS/AIA/

skill_lifecycle:
  states: [ACTIVE, STABLE, CANONIZED, KNOWN]
  known_means: "skill embedded into doctrine; cultural memory, not executable"
  backfill_target: 454 SKILL.md
  status: REQUIRED

godel_future_lineage_as_self:
  status: ADOPTED — embedded in godel_lock_gate.py (5 lines)
  scope: AIA → 777-FORGE build chain
  doctrine: 04_DOCTRINES/f14_godel_future.md
  implementation: |
    Self = { Actor ID } ∪ { Lineage of Reflection / Dreamer }
    if Lineage(Dreamer) ∩ Lineage(Verifier) ≠ ∅:
      return HOLAT  # foreign verifier required
  enforcement: godel_lock_gate.py (existing)
  constitutional: NO new floor (F1-F13 preserved)

# ─── Hub Constitution Compliance ──────────────────────────────────────────

# Each step MUST emit a receipt
each_step_emits_receipt: true
# No step may mutate policy without separate SEAL
no_policy_mutation: true
# No step may bypass F13
f13_veto_active: true
# No self-approval
self_approval_forbidden: true

# ─── Failure Modes ────────────────────────────────────────────────────────

failure_modes:
  - mode: external_council_unavailable
    handling: skip and emit HOLD
  - mode: rrr_snapshot_empty
    handling: abort cycle, escalate to 888
  - mode: anti_fantasy_failed
    handling: quarantine, emit REJECT
  - mode: cycle_locked
    handling: 888_HOLD, F13 notification

# ─── The Test (the only test that matters) ────────────────────────────────

the_test: |
  "Boleh ARIF sambung jejak pemikiran ni bila dia jaga 5 tahun lagi?"
  If yes → IMPIAN is healthy.
  If no → IMPIAN is BANGANG.

# ─── Related Resources ────────────────────────────────────────────────────

related:
  doctrine: 04_DOCTRINES/constrained_imagination.md
  policy: 05_POLICIES/aia-72h.yaml
  verb: 06_CAPABILITIES/arif_impian/
  manifest: 09_AGENTS/aia_horizon.yaml
  driver: forge_aia.py
  storage:
    candidates: 03_EUREKAS/FUTURE/
    quarantine: 03_EUREKAS/FANTASIES/
    receipts: 10_RECEIPTS/AIA/

