  quarantine: 03_EUREKAS/FANTASIES/
  receipts:   10_RECEIPTS/AIA/

# ─── Authority ────────────────────────────────────────────────────────────

authority: OBSERVE-only
trust_tier: sovereign-canonical
blast_radius: low
reversible: true

# ─── Constitutional floors ───────────────────────────────────────────────

constitutional_floors: [F1, F2, F11, F13]

# ─── What AIA does (and doesn't) ──────────────────────────────────────────

does:
  - read present scars, holds, failures
  - scan present capability gaps
  - cross-challenge with external agents
  - assemble proposals (333-AGI synthesizes)
  - critique the synthesis (555-ASI)
  - hold for judgment (888-APEX)
  - seal the cycle (999)

does_not:
  - mutate policy
  - execute code
  - approve self
  - bypass F13 veto
  - fabricate skills
  - skip the Anti-Fantasy Safeguard
  - skip 333/555/888 deliberation

# ─── Anti-Fantasy Safeguard (binding) ────────────────────────────────────

anti_fantasy_safeguard:
  - check_1_reality: rrr_snapshot must be present
  - check_2_scar:    scar_id must be present
  - check_3_evidence: evidence_paths must be non-empty
  - check_4_gap:     capability_gap must be defined
  on_failure: quarantine to 03_EUREKAS/FANTASIES/

# ─── The Test (the only test that matters) ────────────────────────────────

the_test: |
  "Boleh ARIF sambung jejak pemikiran ni bila dia jaga 5 tahun lagi?"
  If yes → AIA is healthy.
  If no → AIA is BANGANG.

