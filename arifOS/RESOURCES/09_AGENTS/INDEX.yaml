# 09_AGENTS — Runtime actors exist
# The 4 lanes of the federation. Agent = consumer of skills, runner of workflows.

layer: 09
name: AGENTS
purpose: Where runtime actors are defined. Each agent is a bounded, auditable, constitutionally-bound runtime.
authority: 4-lane constraint
doctrine: bounded-not-sovereign

# The 4 lanes of AAA (Architects, Auditors, Agents)
lanes:
  - id: 333-AGI
    name: THINK
    duty: Propose architecture, plan, reversible draft
    boundary: cannot judge, cannot execute, cannot certify
  - id: 555-ASI
    name: DREAM
    duty: Review + audit (blind to each other)
    boundary: REVIEW and AUDIT share no context
  - id: 777-FORGE
    name: EXECUTE
    duty: Mutate under SEAL
    boundary: cannot plan, cannot self-authorize, cannot self-seal
  - id: 888-APEX
    name: JUDGE
    duty: Constitutional verdict, authority resolution
    boundary: cannot execute, cannot produce domain evidence

# ─── The Horizon Layer (AIA) — pre-deliberation, NOT a member of AAA ────

horizon_layer:
  id: aia://architecture/horizon
  canonical_name: AIA
  expansion: Agentic Impian Architecture
  codename: 222-AIA
  position: pre-deliberation
  verb: arif_impian
  floor: F2
  cadence: 72h
  doctrine: 04_DOCTRINES/constrained_imagination.md
  policy: 05_POLICIES/aia-72h.yaml
  workflow: 08_WORKFLOWS/aia_72h_cycle.yaml
  manifest: 09_AGENTS/aia_horizon.yaml
  driver: forge_aia.py

  purpose: |
    Sees future possibilities BEFORE AAA deliberates.
    Hands proposals to AAA (333-AGI synthesizes, 555-ASI critiques,
    888-APEX holds, 777-FORGE builds, 999-Seal witnesses).

  relationship_to_aaa: |
    AIA is NOT a member of AAA. AIA is a horizon layer that
    AAA draws from. Without AIA, AAA only sees the present.
    Without AAA, AIA is possibilities without deliberation.

# ─── Dream vs Impian (the clarifying distinction) ──────────────────────

dream_vs_impian:
  dream:
    location: /root/AAA/skills/AGI-dream-engine
    purpose: Memory consolidation (past → present)
    cadence: 72h
  impian:
    location: AIA horizon layer (this substrate)
    purpose: Future possibility sensing (present → future)
    cadence: 72h
  note: "Dream is for memory organization. Impian is for future imagination."

# The sovereign (above the registry)
sovereign:
  - id: 000-SALAM
    name: Human Sovereign
    role: F13 · above the registry · not an agent
    authority: Muhammad Arif bin Fazil

# Sub-layers
subdirs:
  - lanes:         # 333-AGI, 555-ASI, 777-FORGE, 888-APEX
  - external:      # 15+ external harnesses (aider, claude-code, codex, copilot, etc.)
  - identities:    # Ed25519 fingerprints, key files, F13-ratified test agents

# What this layer provides
provides:
  - agent_ids            # 333-AGI, 555-ASI, etc.
  - lane_boundaries      # what each lane can and cannot do
  - escalation_paths     # where violations go
  - skill_loaders        # which skills each agent loads

# What this layer requires
requires:
  - 06_CAPABILITIES       # agents use capabilities
  - 07_SKILLS             # agents load skills
  - 08_WORKFLOWS          # agents run workflows
  - 05_POLICIES           # agents are policy-bound
  - 01_RESOURCES/sovereign  # F13 ratifies sovereign test agents

# Love-links
love_links:
  - 09_AGENTS/lanes/333-AGI    ↔ 06_CAPABILITIES/arif_think
  - 09_AGENTS/lanes/555-ASI    ↔ 06_CAPABILITIES/arif_memory
  - 09_AGENTS/lanes/777-forge  ↔ 06_CAPABILITIES/arif_forge
  - 09_AGENTS/lanes/888-APEX   ↔ 06_CAPABILITIES/arif_judge
  - 09_AGENTS/external         ↔ 01_RESOURCES/openclaw  # external harnesses via OpenClaw
  - 09_AGENTS/identities       ↔ 01_RESOURCES/sovereign  # F13 ratifies identities
  - 09_AGENTS/*                ↔ 08_WORKFLOWS/*          # agents run workflows

