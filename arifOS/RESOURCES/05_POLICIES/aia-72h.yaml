policy: aia-72h
name: AIA::72H — Agentic Impian Architecture
version: 0.2

cadence: every_72h
authority: OBSERVE_ONLY
classification: FUTURE_REFLECTION
mutation: forbidden
auto_execute: false
default_verdict: HOLD

limits:
  max_proposals_per_cycle: 3
  confidence_cap: 0.90
  external_council: monthly_only        # NOT every cycle — ringgit + injection surface
  external_council_allowlist: []        # F13 populates when council first convened
  propose_only: true                    # never build, never approve self

paths:
  grounded_proposals: 03_EUREKAS/FUTURE/
  quarantine: 03_EUREKAS/FANTASIES/
  receipts: 10_RECEIPTS/AIA/

anti_fantasy_gate:
  required: [reality_anchor, scar_id, evidence_paths]
  if_missing: quarantine_as_fantasy

delivery:
  digest_to: sovereign_chat             # Arif — every cycle, BM, <= 8 lines
  quiet_hours: "23:00-07:00 MYT → hold digest until morning"

kill_criteria:                           # F3 CRON LAW — empty cron = burned ringgit
  - 3 consecutive cycles with zero proposals AND zero quarantines → flag for F13 review
  - every cycle must still produce receipt + digest (knowing "nothing new" is also foresight)

separation_law:
  dream: memory_consolidation_backwards   # nightly dream-engine — DO NOT MERGE
  impian: future_imagination_forwards     # this policy
