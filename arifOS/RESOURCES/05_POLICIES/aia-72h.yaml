policy: aia-72h
name: AIA::72H — Agentic Impian Architecture
version: 0.3   ← 2026-08-15: 8 EUREKAs integrated

cadence: every_72h
authority: OBSERVE_ONLY
classification: FUTURE_REFLECTION
mutation: forbidden
auto_execute: false
default_verdict: HOLD

limits:
  max_proposals_per_cycle: 3
  confidence_cap: 0.90
  external_council: monthly_only
  external_council_allowlist: []
  propose_only: true

paths:
  grounded_proposals: 03_EUREKAS/FUTURE/
  blindspots:         03_EUREKAS/BLINDSPOTS/       ← NEW (EUREKA 2)
  quarantine:         03_EUREKAS/FANTASIES/
  receipts:           10_RECEIPTS/AIA/

# ─── 8 EUREKAs — meta-constitutional additions (2026-08-15) ────────────

# EUREKA 2 — Blindspot Ledger
blindspot_ledger:
  required_per_cycle: 1
  format: 03_EUREKAS/BLINDSPOTS/BLIND-<date>-NN.yaml
  fields: [confidence, reason, missing_observation, potential_consequence, class]

# EUREKA 3 — Anti-Hero Trap
anti_hero_trap:
  question: "What capability exists only inside ARIF?"
  thresholds: {red: 0.7, yellow: 0.4, green: 0.4}
  on_red: "schedule F13 transfer briefing"
  on_yellow: "accelerate canonization"

# EUREKA 5 — R2R (Reflection-to-Reality Ratio)
r2r_metric:
  formula: "useful_proposals / total_proposals"
  thresholds: {healthy: 0.6, normal: 0.2, overthinking: 0.2}
  overthinking_trigger: 3 cycles
  logged_in: 10_RECEIPTS/AIA/

# EUREKA 6 — Devil's Advocate
devils_advocate:
  capability: arif_challenge
  prompt: "If this dream destroys arifOS, how would it do so?"
  required_before: 03_EUREKAS/FUTURE/ filing
  verdict: PASS | HOLD | REJECT

# EUREKA 7 — Entropy Budget
entropy_budget:
  required_fields_per_proposal:
    entropy_cost: low | med | high
    maintenance_cost: "<runtime commitment>"
    complexity_cost: "<+N edges to graph>"
  forge_777_must_refuse_if: entropy_cost > entropy_budget

# EUREKA 4 — Skill CANONIZED → KNOWN
skill_lifecycle:
  states: [ACTIVE, STABLE, CANONIZED, KNOWN]
  known_means: "skill embedded into doctrine; cultural memory, not executable"
  backfill_target: 454 SKILL.md

