# What this layer provides
provides:
  - verb_ids            # arif_*
  - input_schema        # each verb has a typed input
  - output_schema       # each verb has a typed output
  - requires_floors     # each verb is bound to F1-F13
  - authority_ceiling   # each verb has a max authority class

# What this layer requires
requires:
  - 01_RESOURCES       # verbs discover resources
  - 05_POLICIES        # verbs are constrained by policies
  - 04_DOCTRINES       # verbs obey doctrines

# Love-links
love_links:
  - 06_CAPABILITIES/arif_observe  ↔ 01_RESOURCES/*  # RRR is the only consumer
  - 06_CAPABILITIES/arif_think   ↔ 03_EUREKAS      # thinking derives eurekas
  - 06_CAPABILITIES/arif_route   ↔ 09_AGENTS       # routing dispatches to agents
  - 06_CAPABILITIES/arif_memory  ↔ 10_RECEIPTS     # memory writes receipts
  - 06_CAPABILITIES/arif_judge   ↔ 04_DOCTRINES    # judge cites doctrine
  - 06_CAPABILITIES/arif_forge   ↔ 01_RESOURCES/aforge  # forge is implemented by A-FORGE
  - 06_CAPABILITIES/arif_seal    ↔ 10_RECEIPTS/seal     # seal appends
  - 06_CAPABILITIES/arif_init    ↔ 09_AGENTS/identities  # init binds identity

