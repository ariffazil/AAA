# 06_CAPABILITIES — Verbs exist
# The 8-verb chain. Atomic, single-purpose, no composition.
# Capabilities come BEFORE skills. Skill = composition of capabilities + resources.

layer: 06
name: CAPABILITIES
purpose: Where atomic verbs are defined. Each capability is a single primitive that does ONE thing.
authority: 8-verb chain (000-999)
doctrine: atomic-no-composition

# The 9 verbs (the full 000-999 spectrum, extended 2026-08-15)
verbs:
  - id: arif_init
    code: 000
    name: Session ignition
    floor: F1
    role: bind
  - id: arif_observe
    code: 111
    name: Sense reality (RRR)
    floor: F2
    role: discover
  - id: arif_impian
    code: 222
    name: Constrained Imagination (BIJAKSANA IMPIAN)   ← NEW 2026-08-15
    floor: F2
