# STATE VOCABULARY
# ================
# implementation.state:  absent | partial | implemented | retired | vendor_candidate
# reachability.state:    unreachable | not_wired | working_unprobed | reachable | degraded
#                         pending_production_probe | intentionally_unreachable | unknown_by_governed_probe
# governance.authority:  observe | draft | external_write | financial_write | admin_write
# governance.activation_gate: none | 888_HOLD | F13_888_HOLD
# lifecycle:             active | partial | deferred | retired | blocked

# CORE RULE
# =========
# implemented = there is code/route/package
# reachable   = Hermes can invoke it RIGHT NOW with evidence
# governed    = invocation has auth, receipts, rate limits, holds
#
# implemented AND reachable AND governed = operational capability
# implemented AND NOT reachable = route or auth gap
# implemented AND reachable AND NOT governed = uncontrolled action risk
# All three states are independent dimensions, not a single "status" field.

